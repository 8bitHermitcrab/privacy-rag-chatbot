<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가명처리 검색 챗봇</title>
<style>
  :root{--bg:#F6F7F9;--card:#FFFFFF;--ink:#1D2433;--ink2:#5B6474;--line:#E2E5EA;--accent:#2F6FDE;--chip:#E8EFFC;--chip-ink:#1F4FA8}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
       font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
  .app{max-width:860px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:0 16px}
  header{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;font-weight:700}
  header span{color:var(--ink2);font-size:13px}
  header label{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
  select{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:3px 6px}
  #log{flex:1;overflow-y:auto;padding:20px 0 8px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex}.row.me{justify-content:flex-end}
  .bubble{max-width:min(680px,88%);padding:10px 14px;border-radius:12px}
  .bot .bubble{background:var(--card);border:1px solid var(--line)}
  .me .bubble{background:var(--accent);color:#fff}
  .tok{display:inline-block;background:var(--chip);color:var(--chip-ink);border-radius:4px;padding:0 6px;
       font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;white-space:nowrap}
  .muted{color:var(--ink2)}
  details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  summary{cursor:pointer;color:var(--ink2);font-size:13px}
  .meta{font-size:13px;margin:6px 0;color:var(--ink2)}
  .doc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
  .doc .key{color:var(--accent);font-weight:600}
  .doc pre{margin:6px 0 0;white-space:pre-wrap;font-family:inherit;color:var(--ink2);max-height:140px;overflow:auto}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 8px}
  .chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
  .chips button:hover{border-color:var(--accent)}
  form{display:flex;gap:8px;padding:4px 0 12px}
  #q{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
  #q:focus{border-color:var(--accent)}
  #send{font:inherit;font-weight:600;border:none;border-radius:8px;padding:0 18px;background:var(--accent);color:#fff;cursor:pointer}
  #send:disabled{opacity:.5;cursor:default}
  .note{font-size:12px;color:var(--ink2);text-align:center;padding-bottom:10px}
  .dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--ink2);animation:d 1s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes d{0%,100%{opacity:.25}50%{opacity:1}}
  @media (max-width:560px){header span{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>가명처리 검색 챗봇</h1><span id="info"></span>
    <label>참고 문서
      <select id="k"><option>1</option><option>2</option><option selected>3</option><option>5</option><option>10</option></select>
    </label>
  </header>
  <main id="log"></main>
  <div class="chips" id="examples"></div>
  <form id="f" autocomplete="off">
    <input id="q" placeholder="질문을 입력하세요">
    <button id="send" type="submit">보내기</button>
  </form>
  <div class="note">API에는 가명처리된 텍스트만 전송되며, 답변의 토큰은 복원하지 않습니다.</div>
</div>
<script>
const EXAMPLES = ["연락처가 010-0791-2924인 건 찾아줘", "보이스피싱 피해 접수 기록 알려줘", "윤 선영 고객 대출 상담 내역 알려줘"];
const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chips = s => esc(s).replace(/&lt;([A-Z_]+_[0-9a-f]{8})&gt;/g, '<span class="tok">$1</span>');

function row(who, html){
  const r = document.createElement("div");
  r.className = "row " + who; r.innerHTML = `<div class="bubble">${html}</div>`;
  log.appendChild(r); log.scrollTop = log.scrollHeight; return r;
}
function answerHtml(res){
  const docs = res.docs || [], qt = new Set(res.query_tokens || []);
  const list = docs.map((d, i) => {
    const hit = (d.tokens || []).some(t => qt.has(t));
    return `<div class="doc"><b>${i + 1}. ${esc(d.doc_id)}</b> · score ${Number(d.score).toFixed(3)} ${hit ? '<span class="key">토큰 일치</span>' : ""}<pre>${chips(d.masked_text)}</pre></div>`;
  }).join("");
  const body = res.answer ? chips(res.answer.trim()).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>") : '<span class="muted">(LLM_API_KEY 없음 — 검색 결과만 표시)</span>';
  return `${body}<details><summary>처리 과정 보기 (문서 ${docs.length}건)</summary>
    <div class="meta">가명처리된 질의: ${chips(res.masked_query)}</div>
    <div class="meta">질의 토큰: ${[...qt].map(chips).join(" ") || "없음 (의미 검색만)"}</div>${list}</details>`;
}
async function ask(text){
  text = text.trim(); if (!text) return;
  row("me", esc(text)); q.value = ""; send.disabled = true;
  const t = row("bot", '<span class="dots"><span></span><span></span><span></span></span>');
  try {
    const r = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({query:text, k:Number(document.getElementById("k").value)})});
    const res = await r.json(); t.remove();
    row("bot", res.error ? esc(res.error) : answerHtml(res));
  } catch (e) {
    t.remove(); row("bot", '<span class="muted">서버에 연결하지 못했습니다. uvicorn 실행 여부를 확인하세요.</span>');
  } finally { send.disabled = false; q.focus(); }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); ask(q.value); });
const ex = document.getElementById("examples");
EXAMPLES.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => ask(s); ex.appendChild(b); });
fetch("/api/info").then(r => r.json()).then(i => {
  document.getElementById("info").textContent = `검색 ${i.search_mode} · 임베딩 ${i.embed_model} · LLM ${i.llm_model}`;
}).catch(() => {});
</script>
</body>
</html>
