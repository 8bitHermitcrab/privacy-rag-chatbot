<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어흥이 관리자센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  금융문서 AI 챗봇 관리자센터 — 대시보드
  - 회원·권한·활동 숫자는 연습용 데이터 (회원·권한 DB와 API 가 생기면 MOCK 부분만 서버 응답으로 바꾸면 됨)
  - '정상 운영 중'은 서버(/api/info)에 실제로 물어본 결과
  - 이름은 성만 남기고 가림(김**). 실제 개인정보는 넣지 않음
  - 이전 '운영 현황' 화면은 admin.html.20261118.bak 에 보관
-->
<style>
  :root{
    --side:#1E2A47; --side-ink:#C9D2E6; --side-on:#2F6BFF;
    --bg:#F4F6FA; --card:#FFFFFF; --ink:#1B2333; --ink2:#5B6578; --ink3:#8A93A5; --line:#E6EAF1; --head:#F7F9FC;
    --blue:#2F6BFF; --blue-bg:#EAF1FF; --orange:#F0A030; --orange-bg:#FFF4E5; --green:#21A56B; --green-bg:#E7F6EF;
    --purple:#8B5CF6; --purple-bg:#F1EBFF; --wait:#E8892B; --wait-bg:#FFEBD6; --err:#D64545; --err-bg:#FDE8E8;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
       font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
  button,select{font:inherit;color:inherit}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  svg.i{width:22px;height:22px;flex:none}

  .app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}

  /* ── 왼쪽 메뉴 ── */
  .side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:26px 12px 22px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:12px;padding:0 12px 30px;color:#fff;font-weight:700;font-size:17px;line-height:1.4}
  .brand svg{width:46px;height:52px;flex:none}
  .menu{display:flex;flex-direction:column;gap:6px}
  .menu a{display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:10px;text-decoration:none;font-size:16px;color:var(--side-ink)}
  .menu a:hover{background:rgba(255,255,255,.07);color:#fff}
  .menu a[aria-current=page]{background:var(--side-on);color:#fff;font-weight:700}
  .side .out{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 20px;border:none;background:none;color:var(--side-ink);cursor:pointer;font-size:14px;text-align:left}
  .side .out:hover{color:#fff}

  /* ── 위쪽 막대 ── */
  .top{display:flex;justify-content:flex-end;align-items:center;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--line);position:relative}
  .me{display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;padding:4px 6px;border-radius:999px}
  .me .av{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
  .me .caret{width:14px;height:14px}
  .drop{position:absolute;right:24px;top:56px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(27,35,51,.12);
        padding:6px;min-width:160px;display:none;z-index:5}
  .drop.open{display:block}
  .drop a,.drop button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:8px;border:none;background:none;text-decoration:none;cursor:pointer;font-size:14px}
  .drop a:hover,.drop button:hover{background:var(--head)}

  main{padding:26px 28px 40px}
  .titleRow{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .titleRow h1{margin:0;display:flex;align-items:center;gap:12px;font-size:32px;line-height:1.2}
  .titleRow h1 svg{width:40px;height:40px}
  .titleRow p{margin:6px 0 0;color:var(--ink2);font-size:17px}
  .mock{font-size:12px;font-weight:500;background:var(--wait-bg);color:var(--wait);border-radius:999px;padding:2px 10px;vertical-align:middle}
  .range{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
  .range select{border:none;background:none;outline:none;cursor:pointer;font-size:15px}

  /* ── 숫자 카드 ── */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:24px}
  .kpi{border-radius:14px;padding:22px 22px 14px;display:grid;grid-template-columns:auto 1fr;column-gap:22px;align-items:center;border:1px solid transparent;min-width:0}
  .kpi .ic{width:58px;height:58px;display:grid;place-items:center}
  .kpi .ic svg{width:52px;height:52px}
  .kpi .l{font-size:16px;color:var(--ink)}
  .kpi .n{font-size:30px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kpi .n small{font-size:.8em}
  .kpi .up{font-size:15px;font-weight:500;color:var(--green);margin-left:8px}
  .kpi .more{grid-column:1/-1;justify-self:end;font-size:14px;text-decoration:none;margin-top:6px}
  .kpi .more:hover{text-decoration:underline}
  .k-blue{background:var(--blue-bg);border-color:#D6E3FF} .k-blue .ic,.k-blue .more{color:var(--blue)}
  .k-orange{background:var(--orange-bg);border-color:#FBE3C2} .k-orange .ic{color:var(--orange)} .k-orange .more{color:var(--blue)}
  .k-green{background:var(--green-bg);border-color:#CDEBDD} .k-green .ic{color:var(--green)} .k-green .more{color:var(--blue)}
  .k-purple{background:var(--purple-bg);border-color:#E2D6FF} .k-purple .ic{color:var(--purple)} .k-purple .more{color:var(--blue)}

  /* ── 패널 ── */
  .row{display:grid;gap:18px;margin-bottom:18px}
  .row.a{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .row.b{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 12px;min-width:0}
  .panel h2{margin:0 0 14px;display:flex;align-items:center;gap:10px;font-size:19px}
  .panel h2 .more{margin-left:auto;font-size:14px;font-weight:400;color:var(--blue);text-decoration:none}
  .panel h2 .more:hover{text-decoration:underline}
  .ph-blue{color:var(--blue)} .ph-green{color:var(--green)}

  .tableWrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:15px;white-space:nowrap}
  th{background:var(--head);color:var(--ink2);font-weight:500;text-align:left;padding:10px 14px}
  td{padding:10px 14px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  table.dense{font-size:14px}
  table.dense td{padding:7px 14px}
  .pill{display:inline-block;min-width:58px;text-align:center;border-radius:999px;padding:1px 12px;font-size:14px;font-weight:500}
  .p-ok{background:var(--green-bg);color:var(--green)}
  .p-wait{background:var(--wait-bg);color:var(--wait)}
  .p-stop{background:var(--err-bg);color:var(--err)}

  /* 도넛 */
  .donutWrap{display:flex;align-items:center;gap:34px;flex-wrap:wrap;justify-content:center;padding:10px 0 14px}
  .donut{position:relative;width:210px;height:210px;flex:none}
  .donut svg{width:100%;height:100%;transform:rotate(-90deg)}
  .donut circle.seg{cursor:pointer;transition:stroke-width .12s}
  .donut circle.seg:hover,.donut circle.seg.hl{stroke-width:30}
  .donut .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
  .donut .center b{font-size:30px;line-height:1.2}
  .donut .center span{font-size:15px;color:var(--ink2)}
  .legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto auto;gap:14px 34px;font-size:16px}
  .legend li{display:contents}
  .legend .k{display:flex;align-items:center;gap:10px}
  .legend .dot{width:13px;height:13px;border-radius:50%}
  .legend .v{font-weight:700;font-variant-numeric:tabular-nums}
  .legend .v small{font-weight:400;color:var(--ink2)}
  .tip{position:fixed;background:var(--ink);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .1s;z-index:9}

  /* 보안 현황 */
  .checks{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:12px;font-size:17px}
  .checks li{display:flex;align-items:center;gap:12px}
  .checks svg{width:26px;height:26px;flex:none}
  .info{display:flex;align-items:center;gap:12px;background:var(--blue-bg);border-radius:10px;padding:14px 16px;font-size:16px}
  .info svg{width:24px;height:24px;color:var(--blue);flex:none}
  .info.bad{background:var(--err-bg)} .info.bad svg{color:var(--err)}

  /* 준비 중 화면 */
  .soon{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:48px 24px;text-align:center;color:var(--ink2)}
  .soon h2{color:var(--ink);margin:10px 0 6px}

  /* ── 회원관리 ── */
  .crumb{font-size:13px;color:var(--ink3);margin-bottom:2px}
  .pageHead h1{margin:0;font-size:26px}
  .pageHead p{margin:4px 0 16px;color:var(--ink2);font-size:14px}
  .notice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .notice b{display:block;font-size:16px;margin-bottom:4px}
  .notice span{color:var(--ink2);font-size:14px}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px}
  .iconBtn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer}
  .iconBtn:hover{background:var(--head)}
  .iconBtn svg{width:18px;height:18px}
  .primaryBtn{display:inline-flex;align-items:center;gap:8px;border:none;background:var(--blue);color:#fff;border-radius:10px;padding:0 16px;height:40px;cursor:pointer;font-weight:500}
  .primaryBtn:hover{background:#1F57E0}
  .primaryBtn:disabled{opacity:.5;cursor:default}
  .primaryBtn.danger{background:var(--err)} .primaryBtn.danger:hover{background:#B83434}
  .ghostBtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 16px;height:40px;cursor:pointer}
  .ghostBtn:hover{background:var(--head)}
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
  .tile .t{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500}
  .tile .t svg{width:18px;height:18px;color:var(--ink3)}
  .tile .n{font-size:28px;font-weight:700;margin:8px 0 2px;font-variant-numeric:tabular-nums}
  .tile .d{font-size:12.5px;color:var(--ink3)}
  .listPanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .listPanel h2{margin:0;font-size:18px}
  .listPanel > p{margin:2px 0 14px;color:var(--ink2);font-size:14px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--line)}
  .tabs button{border:none;background:none;padding:8px 12px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
  .tabs button[aria-selected=true]{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
  .tabs .c{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--head);font-size:12px;color:var(--ink2)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filters input,.filters select{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);outline:none;min-width:0}
  .filters input{flex:1 1 220px}
  .filters input:focus,.filters select:focus{border-color:var(--blue)}
  .mtable{border:1px solid var(--line);border-radius:10px;overflow-x:auto}
  .mtable th{font-size:13.5px}
  .mtable td{font-size:14px;vertical-align:middle}
  .who{display:flex;align-items:center;gap:12px}
  .av2{width:36px;height:36px;border-radius:50%;background:var(--head);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink2);flex:none}
  .who b{display:block;font-weight:500}
  .who small{color:var(--ink3);font-size:12.5px}
  .tag2{display:inline-block;border-radius:999px;padding:1px 12px;font-size:13px;font-weight:500;white-space:nowrap}
  .r-STAFF{background:var(--blue-bg);color:var(--blue)}
  .r-TEAM_LEAD{background:var(--green-bg);color:var(--green)}
  .r-ADMIN{background:var(--purple-bg);color:var(--purple)}
  .s-PENDING{background:var(--wait-bg);color:#B5650F}
  .s-ACTIVE{background:var(--green-bg);color:#178253}
  .s-SUSPENDED{background:var(--err-bg);color:var(--err)}
  .s-IDENTITY_PENDING{background:var(--purple-bg);color:#6D3FD9}
  .id-HR_VERIFIED{color:#178253} .id-DOC_CONFIRMED{color:var(--blue)} .id-UNVERIFIED{color:var(--ink3)}
  .idmark{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;white-space:nowrap}
  .idmark i{width:8px;height:8px;border-radius:50%;background:currentColor}
  .kebab{width:32px;height:32px;border:none;background:none;border-radius:8px;cursor:pointer;font-size:18px;line-height:1}
  .kebab:hover{background:var(--head)}
  .pop{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(27,35,51,.14);padding:6px;min-width:150px;z-index:8;display:none}
  .pop.open{display:block}
  .pop button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
  .pop button:hover{background:var(--head)}
  .pop button.warn{color:var(--err)}
  .emptyRow{text-align:center;color:var(--ink3);padding:28px}
  .pager2{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--ink3);font-size:13px}
  /* 상세 옆 창 */
  .sheet{position:fixed;inset:0;z-index:10;display:none}
  .sheet.open{display:block}
  .sheet .dim{position:absolute;inset:0;background:rgba(27,35,51,.35)}
  .sheet aside{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  .sheet h3{margin:0;font-size:19px;display:flex;align-items:center;gap:10px}
  .sheet h3 .x{margin-left:auto;border:none;background:none;font-size:22px;cursor:pointer;color:var(--ink3)}
  .dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0;font-size:14px}
  .dl dt{color:var(--ink3)}
  .dl dd{margin:0}
  .hist{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);font-size:13.5px}
  .hist li{position:relative;padding:0 0 12px 16px}
  .hist li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
  .hist time{display:block;color:var(--ink3);font-size:12.5px}
  .sheetActs{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
  dialog.dlg{border:1px solid var(--line);border-radius:14px;padding:22px;width:min(440px,calc(100% - 32px));color:var(--ink)}
  dialog.dlg::backdrop{background:rgba(27,35,51,.35)}
  dialog.dlg h3{margin:0 0 8px;font-size:18px}
  dialog.dlg p{margin:0 0 12px;color:var(--ink2);font-size:14px}
  dialog.dlg label{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
  dialog.dlg textarea,dialog.dlg input,dialog.dlg select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:4px;outline:none}
  dialog.dlg textarea:focus,dialog.dlg input:focus,dialog.dlg select:focus{border-color:var(--blue)}
  dialog.dlg .err{color:var(--err);font-size:13px;min-height:1.2em;margin-bottom:8px}
  dialog.dlg .row2{display:flex;justify-content:flex-end;gap:8px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;
         opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}

  /* ── 권한관리 ── */
  .rolesTop{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-bottom:22px;align-items:start}
  .rolesHead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
  .rolesHead h1{margin:0;font-size:26px}
  .rolesHead h2{margin:0;font-size:20px}
  .rolesHead p{margin:4px 0 0;color:var(--ink2);font-size:14px;max-width:420px}
  .rolesHead .btns{margin-left:auto;display:flex;gap:8px}
  .badgeStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-top:18px}
  .bstat{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 16px 16px;text-align:center;box-shadow:0 2px 6px rgba(27,35,51,.06)}
  .bstat .ic{position:absolute;left:-10px;top:-18px;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);
             display:grid;place-items:center;box-shadow:0 2px 6px rgba(27,35,51,.08)}
  .bstat .ic svg{width:20px;height:20px}
  .bstat .t{font-size:12.5px;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}
  .bstat .n{font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .quick{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .quick h3{margin:0 0 10px;font-size:12.5px;letter-spacing:.06em;color:var(--ink2)}
  .quick button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;
                padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .quick button:hover{background:var(--head)}
  .quick button:last-child{margin-bottom:0}
  .quick button svg{width:22px;height:22px;flex:none;color:var(--ink2)}
  .quick b{display:block;font-size:14px;font-weight:500}
  .quick small{color:var(--ink3);font-size:12.5px}
  .quick .chev{margin-left:auto;color:var(--ink3)}
  .actPanel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .actPanel .bar2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px}
  .actPanel .bar2 h2{margin:0;font-size:16px;letter-spacing:.06em}
  .actPanel .bar2 input{margin-left:auto;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;min-width:0;flex:0 1 300px;outline:none}
  .actPanel .bar2 input:focus{border-color:var(--blue)}
  .ptable th{background:#FDF0F0;color:var(--ink2);font-size:12.5px;letter-spacing:.04em;font-weight:500}
  .ptable td{font-size:14px}
  .ptable tr.sel td{background:var(--blue-bg)}
  .ptable tr.locked td{color:var(--ink3)}
  .dot2{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:1px 8px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--head)}
  .dot2 i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .scope{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .rs-yes{color:#178253;font-weight:700} .rs-no{color:var(--ink3)}
  .diffMark{display:inline-block;margin-left:6px;font-size:11.5px;color:#B5650F;background:var(--wait-bg);border-radius:6px;padding:0 6px}
  .editBtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:13px}
  .editBtn:hover{background:var(--head)}
  .editBtn:disabled{opacity:.45;cursor:default}
  /* 권한 수정 폼 */
  .pform{display:flex;flex-direction:column;gap:16px}
  .pform fieldset{border:none;margin:0;padding:0}
  .pform legend,.pform label.lbl{font-weight:700;font-size:14px;margin-bottom:6px;display:block}
  .pform select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;outline:none;background:var(--card)}

  .pform textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg.two{grid-template-columns:repeat(2,1fr)}
  .seg label{display:flex;flex-direction:column;align-items:center;padding:8px 6px;cursor:pointer;border-left:1px solid var(--line);text-align:center;font-size:13.5px}

  .seg label small{color:var(--ink3);font-size:11.5px}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label:has(input:checked){background:var(--blue);color:#fff}
  .seg label:has(input:checked) small{color:#DCE6FF}
  .seg label:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:-3px}
  .seg label:has(input:disabled){opacity:.45;cursor:not-allowed}
  .fhint{font-size:12.5px;color:var(--ink3);margin-top:4px}
  .fhint.warn{color:#B5650F}
  .ferr{font-size:13px;color:var(--err);min-height:1.2em}
  .diffList{list-style:none;margin:0 0 10px;padding:0;border:1px solid var(--line);border-radius:10px}
  .diffList li{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
  .diffList li:last-child{border-bottom:none}
  .diffList .k{color:var(--ink3)}
  .diffList del{color:var(--ink3)}
  .diffList ins{text-decoration:none;font-weight:700;color:var(--blue)}
  .warnBox{background:var(--wait-bg);color:#8A4B0A;border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}
  .warnBox ul{margin:4px 0 0;padding-left:18px}

  /* ── 팀 관리 ── */
  .stiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .stile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;min-width:0}
  .stile:hover{border-color:#C9D6EE}
  .stile[aria-pressed=true]{border:2px solid var(--blue);padding:11px 13px;box-shadow:0 0 0 3px var(--blue-bg)}
  .stile svg{width:18px;height:18px;display:block;margin-bottom:6px}
  .stile .n{display:block;font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
  .stile .l{font-size:12.5px;color:var(--ink2)}
  .bar3{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
  .bar3 input,.bar3 select{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card);outline:none;min-width:0}
  .bar3 input{flex:1 1 240px}
  .bar3 select{flex:0 1 200px}
  .bar3 input:focus,.bar3 select:focus{border-color:var(--blue)}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
  .etable{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .etable .tableWrap{max-height:640px;overflow:auto}
  #tTeamView .etable .tableWrap{max-height:none}
  .etable th{position:sticky;top:0;z-index:1;font-size:13px}
  .etable td{font-size:14px;vertical-align:middle}
  .etable tbody tr{cursor:pointer}
  .etable tbody tr:hover td{background:#F7FAFF}
  .etable tbody tr.sel td{background:#EAF4F1}
  .etable tbody tr.unres td{background:#FFF6F6}
  .etable tbody tr.unres.sel td{background:#FBD9D9}
  .etable tbody tr.unres.sel .st-UNRESOLVED{background:#fff}
  .eav{width:34px;height:34px;border-radius:50%;background:#D7EDE7;color:#1F6B5A;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
  .st{display:inline-block;border-radius:6px;padding:1px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
  .st-OFFICIAL{background:var(--green-bg);color:#178253}
  .st-DOC_CONFIRMED{background:var(--blue-bg);color:var(--blue)}
  .st-EMPLOYEE_CANDIDATE{background:var(--wait-bg);color:#B5650F}
  .st-UNRESOLVED{background:var(--err-bg);color:var(--err)}
  .ev{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--ink2)}
  .linkTag{font-size:13px}
  .linkTag.none{color:var(--ink3)}
  .card2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;position:sticky;top:14px}
  .card2 .bigav{width:64px;height:64px;border-radius:50%;background:#D7EDE7;color:#1F6B5A;display:grid;place-items:center;font-size:18px;font-weight:700;margin:0 auto 10px}
  .card2 h3{margin:0;text-align:center;font-size:18px}
  .card2 .sub{text-align:center;color:var(--ink2);font-size:13.5px;margin:2px 0 8px}
  .card2 .ctr{text-align:center;margin-bottom:12px}
  .card2 ul{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
  .card2 li{display:grid;grid-template-columns:96px 1fr;gap:8px}
  .card2 li span:first-child{color:var(--ink3)}
  .card2 h4{margin:12px 0 8px;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
  .card2 .warn{background:var(--err-bg);color:#9B2C2C;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
  .card2 .note{background:var(--wait-bg);color:#8A4B0A;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
  .card2 .btnRow{display:flex;gap:8px;flex-wrap:wrap}
  .card2 .btnRow button{flex:1}
  .card2 .emptyCard{text-align:center;color:var(--ink3);padding:30px 0}
  .tabs2{display:flex;gap:6px;margin-bottom:12px}
  .tabs2 button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:14px}
  .tabs2 button[aria-selected=true]{background:#1F6B5A;border-color:#1F6B5A;color:#fff}
  .tabs2 .primaryBtn{background:var(--blue);border-color:var(--blue);color:#fff;border-radius:10px;font-weight:500}
  .tabs2 .primaryBtn:hover{background:#1F57E0}
  .src2{font-size:12.5px;color:var(--ink3);margin:-6px 0 12px}
  /* 팀 권한 */
  .pchip{display:inline-block;border-radius:6px;padding:0 7px;font-size:12px;background:var(--head);color:var(--ink3);margin:1px 2px 1px 0;white-space:nowrap}
  .pchip.on{background:var(--green-bg);color:#178253}
  .pchip.scope{background:var(--blue-bg);color:var(--blue);font-family:ui-monospace,Menlo,Consolas,monospace}
  .linkBtn{border:none;background:none;padding:0;cursor:pointer;font-weight:700;color:var(--ink);text-align:left}
  .linkBtn:hover{color:var(--blue);text-decoration:underline}
  dialog.dlg{max-height:92vh;overflow:auto}
  dialog.dlg .seg label{display:flex;margin:0;font-weight:400}
  dialog.dlg fieldset{border:none;margin:0 0 10px;padding:0}
  dialog.dlg legend{font-size:14px;font-weight:500;margin-bottom:4px;padding:0}
  .kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  dialog.dlg .kinds label{display:flex;align-items:center;gap:6px;font-weight:400;margin:0;font-size:13.5px}
  dialog.dlg .kinds input{width:auto;margin:0}

  .cando{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
  .cando li{display:flex;gap:8px;align-items:flex-start}
  .cando li b{flex:none;width:18px;text-align:center}
  .roleGrid{width:100%;border-collapse:collapse;font-size:13px;white-space:normal}
  .roleGrid th,.roleGrid td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  .roleGrid th{background:var(--head);font-weight:500;color:var(--ink2)}
  .roleGrid th[scope=row]{white-space:nowrap}
  .mcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .mcard .top2{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .capNote{font-size:12px;color:#B5650F;margin-top:4px}

  /* ── 활동기록 ── */
  .hero{position:relative;overflow:hidden;border-radius:14px;padding:26px 28px;color:#fff;display:flex;align-items:center;gap:24px;flex-wrap:wrap;
        background:radial-gradient(circle at 18% 30%,rgba(120,140,255,.25) 0 2px,transparent 3px) 0 0/90px 70px,
                   radial-gradient(circle at 70% 60%,rgba(160,180,255,.18) 0 1.5px,transparent 2.5px) 0 0/120px 80px,
                   linear-gradient(120deg,#121A2E,#1E2A47 55%,#26346A)}
  .hero h1{margin:0;font-size:28px}
  .hero p{margin:4px 0 0;color:#B9C3DA;font-size:14px}
  .hero .hstats{margin-left:auto;display:flex;gap:30px;padding-left:26px;border-left:1px solid rgba(255,255,255,.25)}
  .hero .hstats div{text-align:center}
  .hero .hstats b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
  .hero .hstats span{font-size:12px;letter-spacing:.06em;color:#C9D2E6}
  .breakdown{background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;padding:18px 22px;margin:-8px 0 18px}
  .breakdown .bh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .breakdown .bh h2{margin:0;font-size:13px;letter-spacing:.08em;color:var(--ink2);font-weight:500}
  .breakdown .bh .note2{font-size:12.5px;color:var(--ink3)}
  .breakdown .bh button{margin-left:auto;border:none;background:none;color:var(--blue);cursor:pointer;font-size:14px}
  .bgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 26px}
  .bitem{border:none;background:none;padding:6px 4px;border-radius:8px;text-align:left;cursor:pointer;min-width:0}
  .bitem:hover{background:var(--head)}
  .bitem[aria-pressed=true]{background:var(--blue-bg)}
  .bitem .row3{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
  .bitem .row3 span{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bitem .row3 b{font-variant-numeric:tabular-nums}
  .bitem .trk{height:6px;border-radius:0 4px 4px 0;background:var(--head)}
  .bitem .fl{height:100%;border-radius:0 4px 4px 0;background:#18A5B8}
  .bitem.key .row3 span{font-weight:700}
  .afilters{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .pills{display:flex;background:#E9EDF4;border-radius:999px;padding:4px}
  .pills button{border:none;background:none;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px;color:var(--ink2);white-space:nowrap}
  .pills button[aria-pressed=true]{background:var(--blue);color:#fff}
  .afilters .fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
  .afilters .fld[hidden]{display:none}
  .afilters .fld:first-of-type{margin-left:auto}
  .afilters select,.afilters input{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--card);min-width:150px;outline:none}
  .afilters select:focus,.afilters input:focus{border-color:var(--blue)}
  .atable{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .atable th{font-size:12.5px;letter-spacing:.05em}
  .atable td{font-size:13.5px;vertical-align:middle}
  .atable tr.day td{background:var(--card);color:var(--blue);font-weight:700;font-size:13px;padding-top:14px}
  .atable tr.day td::before{content:"●";margin-right:6px;font-size:10px;vertical-align:1px}
  .atable .tm b,.mtable .tm b{display:block;font-weight:500}
  .atable .tm small,.mtable .tm small{color:var(--ink3)}
  .chev{width:28px;height:28px;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--ink3);transition:transform .15s}
  .chev:hover{background:var(--head)}
  .chev[aria-expanded=true]{transform:rotate(90deg);color:var(--ink)}
  .actor{display:flex;align-items:center;gap:8px}
  .actor i{width:24px;height:24px;border-radius:50%;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
  .atag{display:inline-block;border-radius:6px;padding:1px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .a-good{background:var(--green-bg);color:#178253}
  .a-bad{background:var(--err-bg);color:var(--err)}
  .a-perm{background:var(--blue-bg);color:var(--blue)}
  .a-pii{background:var(--purple-bg);color:#6D3FD9}
  .ent small{display:block;color:var(--ink3);font-size:12px}
  .ent b{font-weight:500;color:var(--blue)}
  .atable td.chg{white-space:normal;min-width:220px;color:var(--ink2)}
  .detailRow td{background:var(--head)}
  .dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 24px;font-size:13.5px;padding:4px 0}
  .dgrid div span{display:block;color:var(--ink3);font-size:12px}
  .dgrid > div{min-width:0;overflow-wrap:anywhere}   /* 띄어쓰기 없는 긴 값도 칸 안에서 줄바꿈 */
  .dgrid > .wide{grid-column:1 / -1}                 /* 변경 전·변경 후는 한 줄 전체 사용 */
  .more2{display:block;margin:12px auto 0}
  .readonly{font-size:12.5px;color:var(--ink3);margin:10px 0 0;text-align:center}

  /* ── 시스템 환경 ── */
  .sbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
  .sbar h2,.sh2{font-size:17px;margin:0}
  .sbar h2{margin-right:auto}
  .sh2{margin:22px 0 10px}
  .sbar .ghostBtn{height:38px}
  .hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .hcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .hcard.key{border:2px solid var(--purple)}
  .hcard .htop{display:flex;align-items:center;gap:10px}
  .hcard .htop b{font-size:15.5px}
  .hcard .ic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--blue-bg);color:var(--blue)}
  .hcard.key .ic{background:var(--purple-bg);color:var(--purple)}
  .hcard .ic svg{width:20px;height:20px}
  .hcard .keytag{font-size:11px;font-weight:700;color:#6D3FD9;background:var(--purple-bg);border-radius:999px;padding:1px 8px}
  .hcard .desc{font-size:13.5px;color:var(--ink2)}
  .hcard .detail{font-size:13px;color:var(--ink)}
  .hcard .impact{font-size:12.5px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}

  .h-ok{background:var(--green-bg);color:#178253}
  .h-warn{background:var(--wait-bg);color:#B5650F}
  .h-down{background:var(--err-bg);color:var(--err)}
  .h-unknown,.h-wait{background:var(--head);color:var(--ink3);border:1px solid var(--line)}
  .hsrc{font-size:11.5px;color:var(--ink3)}
  .otiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
  .otiles .tile .n{font-size:22px}
  .cfg{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:10px 0 0;font-size:14px}
  .cfg dt{color:var(--ink3)} .cfg dd{margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}

  /* ── 탐지 검토 ── */
  .dtiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0 12px}
  #dlg textarea{font-family:inherit}
  .dlist{display:flex;flex-direction:column;gap:10px}
  .ditem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
  .ditem.done{background:#FAFBFD}
  .ditem .dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink3)}
  .ditem .why{grid-column:1;font-size:14.5px;font-weight:500}
  .snip{font-size:15px;line-height:1.9;background:var(--head);border-radius:8px;padding:6px 10px;word-break:break-all}
  .snip .ctx{color:var(--ink2)}
  .snip mark{background:#FFE08A;color:var(--ink);border-radius:3px;padding:1px 2px;font-weight:700}
  .snip mark.sug{background:#C9F2DC}
  .snip mark.gone{background:none;text-decoration:line-through;color:var(--err)}
  .snip mark.miss{background:none;outline:2px dashed var(--err);outline-offset:1px}
  .snip mark .tok{background:#fff}
  .dtile{text-align:left;font:inherit;color:inherit;cursor:pointer}
  .dtile[aria-pressed=true]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg)}
  .dtile .n{font-size:24px}
  .lbl{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--head);border:1px solid var(--line);color:var(--ink2)}
  .ktag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
  .dbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
  .dbar .grow{flex:1}
  .dbar .fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
  .dbar input{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--card);min-width:180px;outline:none}
  .dbar input:focus{border-color:var(--blue)}
  .dbar .ghostBtn{height:38px}
  .dbar .ghostBtn:disabled{opacity:.5;cursor:default}
  .dnote{font-size:12.5px;color:var(--ink3);margin:0 0 10px}
  .snip .tok{display:inline-block;background:var(--blue-bg);color:var(--blue);border-radius:999px;padding:0 6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72em;line-height:1.6;vertical-align:1px}
  .snipRow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px;align-items:center;font-size:13px;color:var(--ink3)}

  .dacts button{height:34px;font-size:13.5px}
  .k-MISSED_NAME,.k-MISSED_NUMBER{background:var(--err-bg);color:var(--err)}
  .k-BOUNDARY_CUT{background:var(--wait-bg);color:#B5650F}
  .k-BOUNDARY_PARTICLE{background:var(--purple-bg);color:#6D3FD9}
  .k-NOT_PII{background:var(--blue-bg);color:var(--blue)}
  .k-LABEL_CONFLICT{background:var(--green-bg);color:#178253}
  .st-wait{color:var(--ink3)} .st-fixed{color:#178253;font-weight:700} .st-kept{color:var(--blue);font-weight:700}
  .adjust{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin:8px 0}
  .adjust span{font-size:13px;color:var(--ink2)}
  .adjust .btns2{display:flex;gap:4px}
  .adjust button{width:auto;height:30px;padding:0 10px;font-size:12.5px}

  @media (max-width:1180px){
    .hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}

  @media (max-width:820px){
    .app{grid-template-columns:minmax(0,1fr)}
    .side{position:static;height:auto;padding:14px 12px}

  /* 팀 권한 설정 안의 직책별 행. 기존 사이드 패널을 그대로 사용합니다. */

  .prList th{position:sticky;top:0;background:var(--head);text-align:left;padding:9px 10px;color:var(--ink3);font-weight:500}
  .prList td{padding:9px 10px;border-top:1px solid var(--line)}
  .prList tr.prRow{cursor:pointer}.prList tr.prRow:hover td{background:var(--head)}.prList tr.prRow.on td{background:var(--blue-bg)}
  .prEmpty{color:var(--ink3);padding:30px 0;text-align:center}

  .prHead h2{margin:0;font-size:18px}.prHead p{margin:4px 0 0;color:var(--ink3);font-size:13px}
  .prBadge{border-radius:6px;padding:4px 9px;font-size:12px;background:var(--head);color:var(--ink2);white-space:nowrap}
  .prBadge.held{background:var(--orange-bg);color:#9A5B00}.prBadge.done{background:var(--green-bg);color:#17734B}
  .prDetail h3{font-size:14px;margin:18px 0 8px}.prDetail h3 small{color:var(--ink3);font-weight:400;margin-left:6px}
  .prDoc{white-space:pre-wrap;line-height:1.85;background:var(--head);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;max-height:300px;overflow:auto}
  .prDoc .pii{background:#E9EDF4;border-radius:4px;padding:0 3px}.prDoc .pii.hit{background:#FFE3A8;color:#6B4300;font-weight:700}
  .prVals{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
  .prVals li{background:var(--head);border-radius:8px;padding:6px 10px;font-size:13.5px}.prVals li span{color:var(--ink3);margin-right:6px}
  .prWarn{color:#9A5B00;font-size:13px;margin:6px 0 0}

  .prCard{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.prCard.cur{border-color:var(--blue)}
  .prCard h4{margin:0 0 4px;font-size:14.5px}.prCard p{margin:4px 0;color:var(--ink3);font-size:12.5px}

  .prCard .ghostBtn{margin-top:6px}

  .menu a[hidden]{display:none}

  /* ════════ 어흥이 테마 (목업 lead.html 스타일) ════════
     HTML 구조·id·기능 코드는 그대로 두고 색·글꼴·모서리만 덮어씁니다.
     원래 파란 테마로 되돌리려면 이 블록만 지우면 됩니다. */
  :root{
    --side:#FDE7BF; --side-ink:#4A2E14; --side-on:#A84A12;
    --bg:#FFF6E6; --card:#FFFDF8; --ink:#4A2E14; --ink2:#7A5634; --ink3:#8A6A48; --line:#EED9B5; --head:#FFF1D6;
    --blue:#A84A12; --blue-bg:#FFE3B8; --orange:#E8892B; --orange-bg:#FFF1D6; --green:#5B8C5A; --green-bg:#E4EFE3;
    --purple:#8E5B9F; --purple-bg:#F4E9F5; --wait:#C9671A; --wait-bg:#FFE9CC; --err:#B43B3B; --err-bg:#FDECEA;
  }
  body{font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  h1,h2,h3,.brand span,.kpi .n,.tile .n,.stile .n,.bstat .n,.hero .hstats b,.donut .center b{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
  :focus-visible{outline-color:#E8892B}

  /* 왼쪽 메뉴: 밝은 살구색 바탕 + 선택 메뉴는 진한 주황 */
  .side{border-right:1px solid var(--line)}
  .brand{color:var(--ink);font-size:22px;line-height:1.15}
  .brand svg{width:46px;height:46px}
  .brand small{font-family:'Gowun Dodum',sans-serif;font-size:13px;color:var(--ink2)}
  .menu a{color:var(--ink);font-size:17px;border-radius:12px}
  .menu a svg{color:#C9671A}
  .menu a:hover{background:rgba(168,74,18,.08);color:var(--ink)}
  .menu a[aria-current=page]{background:#A84A12;color:#fff;font-weight:400}
  .menu a[aria-current=page] svg{color:#FFE3B8}
  .side .out{margin:auto 4px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink2)}
  .side .out:hover{color:#A84A12}

  /* 카드·패널: 둥글게, 테두리는 살구색 */
  .panel,.listPanel,.notice,.tile,.etable,.atable,.actPanel,.quick,.card2,.hcard,.bar3,.soon,.ditem,.bstat,.kpi,.mtable{border-radius:16px}
  .k-blue{border-color:#F3CF9A} .k-orange{border-color:#F6DDB4} .k-green{border-color:#CFE2CD} .k-purple{border-color:#E6D3EA}

  /* 버튼: 알약 모양 + 아래 그림자 */
  .primaryBtn{border-radius:999px;box-shadow:0 3px 0 #7A3E1A}
  .primaryBtn:hover,.tabs2 .primaryBtn:hover{background:#8A3F0E}
  .primaryBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #7A3E1A}
  .primaryBtn.danger{box-shadow:0 3px 0 #7E2525} .primaryBtn.danger:hover{background:#962F2F}
  .ghostBtn,.editBtn{border-color:#CDB894;border-radius:999px}
  .ghostBtn:disabled,.primaryBtn:disabled{opacity:.5;cursor:default;box-shadow:none}
  /* 계정 상태: 휴면·퇴사 */
  .s-DORMANT{background:var(--head);color:var(--ink2)}
  .s-RETIRED{background:#EFE6DA;color:#6B5238}
  /* 문서 관리 상태 타일 6개 */
  .docTiles{grid-template-columns:repeat(6,minmax(0,1fr))}
  @media (max-width:1180px){.docTiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:820px){.docTiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
  /* 시스템 환경 > 권한·데이터 점검 */
  .dchecks{list-style:none;margin:0;padding:0}
  .dchecks li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 4px;border-bottom:1px solid var(--line)}
  .dchecks li:last-child{border-bottom:none}
  .dchecks .lv{font-size:18px;line-height:1.5}
  .dchecks .t{font-size:15px}
  .dchecks .cnt{font-family:'Jua',sans-serif;font-size:19px;margin-left:8px;color:var(--ink)}
  .dchecks .lv-bad .cnt{color:var(--err)} .dchecks .lv-warn .cnt{color:var(--wait)} .dchecks .lv-ok .cnt{color:#3F6B3E}
  .dchecks p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
  .dchecks .ids{display:block;margin-top:2px;font-size:12.5px;color:var(--ink3);font-family:ui-monospace,Menlo,Consolas,monospace}
  .dchecks .ghostBtn{height:34px;font-size:13.5px;white-space:nowrap}
  @media (max-width:820px){.dchecks li{grid-template-columns:24px minmax(0,1fr)}.dchecks .ghostBtn{grid-column:2;justify-self:start}}
  /* 문서 관리 표의 체크 칸 */
  #docBody input[type=checkbox],#docAll{width:18px;height:18px;accent-color:#A84A12;cursor:pointer}
  .tabs2 button[aria-selected=true]{background:#5B8C5A;border-color:#5B8C5A}

  /* 상태 글자색: 초록·보라를 테마에 맞게 */
  .s-ACTIVE,.st-OFFICIAL,.a-good,.h-ok,.pchip.on,.k-LABEL_CONFLICT,.rs-yes,.id-HR_VERIFIED,.st-fixed{color:#3F6B3E}
  .s-IDENTITY_PENDING,.a-pii,.k-BOUNDARY_PARTICLE,.hcard .keytag{color:#6E3F80}

  /* 그 밖에 파란 계열로 직접 적혀 있던 색 */
  .ptable th{background:var(--head)}
  .seg label:has(input:checked) small{color:#FFE3C8}
  .stile:hover{border-color:#E8C99A}
  .etable tbody tr:hover td{background:#FFF6E6}
  .etable tbody tr.sel td{background:#FFE9CC}
  .eav,.card2 .bigav{background:#FFE3B8;color:#8A3F0E}
  .pills{background:#F6E7CB}
  .bitem .fl{background:#E8892B}
  .ditem.done{background:#FFFAF0}
  .hero{background:radial-gradient(circle at 18% 30%,rgba(255,227,184,.18) 0 2px,transparent 3px) 0 0/90px 70px,
                   linear-gradient(120deg,#4A2E14,#7A3E1A 55%,#A84A12)}
  .hero p,.hero .hstats span{color:#FFE3C8}
  .sheet .dim,dialog.dlg::backdrop{background:rgba(74,46,20,.35)}
  .drop,.pop{box-shadow:0 8px 24px rgba(74,46,20,.14)}
  .bstat,.bstat .ic{box-shadow:0 2px 6px rgba(74,46,20,.08)}
  .toast{background:#4A2E14}

  /* 화면 코드 안에 색이 직접 적힌 아이콘(SVG)도 테마 색으로 바꿈 */
  [fill="#2F6BFF"]{fill:#A84A12} [stroke="#2F6BFF"]{stroke:#A84A12}
  [stroke="#1B2333"]{stroke:#4A2E14} [stroke="#1F6B5A"]{stroke:#5B8C5A}
  [fill="#21A56B"]{fill:#5B8C5A} [stroke="#21A56B"]{stroke:#5B8C5A}
  [stroke="#8B5CF6"]{stroke:#8E5B9F}

  @media (max-width:820px){ .brand{font-size:18px} .brand svg{width:36px;height:36px} .menu a{font-size:15px} }
</style>
</head>

}

function drawDonut(){
  const total = MOCK.roles.reduce((s, r) => s + r.count, 0);
  const R = 46, C = 2 * Math.PI * R, GAP = 1.2;   // 조각 사이 틈 (배경색으로 띄움)
  let offset = 0;
  $("donut").innerHTML = MOCK.roles.map((r, i) => {
    const len = r.count / total * C;
    const seg = `<circle class="seg" data-i="${i}" cx="60" cy="60" r="${R}" fill="none" stroke="${r.color}" stroke-width="24"
      stroke-dasharray="${Math.max(len - GAP, 0)} ${C}" stroke-dashoffset="${-offset}" tabindex="0"
      aria-label="${r.name} ${r.count}명 ${Math.round(r.count / total * 100)}%"></circle>`;
    offset += len;
    return seg;
  }).join("");
  $("donutTotal").textContent = `${num(total)}명`;
  $("legend").innerHTML = MOCK.roles.map((r, i) => `<li data-i="${i}">
      <span class="k"><span class="dot" style="background:${r.color}"></span>${r.name} (${r.code})</span>
      <span class="v">${r.count}명 <small>(${Math.round(r.count / total * 100)}%)</small></span></li>`).join("");

  // 마우스를 올리면 조각을 굵게 하고 값 표시
  const tip = $("tip");
  const show = (i, x, y) => {
    const r = MOCK.roles[i];
    tip.textContent = `${r.name} (${r.code}) · ${r.count}명 · ${Math.round(r.count / total * 100)}%`;
    tip.style.left = (x + 12) + "px"; tip.style.top = (y + 12) + "px"; tip.style.opacity = 1;
    document.querySelectorAll("#donut .seg").forEach(s => s.classList.toggle("hl", s.dataset.i == i));
  };
  const hide = () => { tip.style.opacity = 0; document.querySelectorAll("#donut .seg").forEach(s => s.classList.remove("hl")); };
  document.querySelectorAll("#donut .seg").forEach(s => {
    s.addEventListener("mousemove", e => show(s.dataset.i, e.clientX, e.clientY));
    s.addEventListener("mouseleave", hide);
    s.addEventListener("focus", () => { const b = s.getBoundingClientRect(); show(s.dataset.i, b.right, b.top); });
    s.addEventListener("blur", hide);
  });
}

function drawTables(){
  const pill = s => `<span class="pill ${s === "승인" ? "p-ok" : s === "대기" ? "p-wait" : "p-stop"}">${esc(s)}</span>`;
  $("newMembers").innerHTML = MOCK.newMembers.map(([d, id, name, st, role]) =>
    `<tr><td>${d}</td><td>${esc(id)}</td><td>${esc(name)}</td><td>${pill(st)}</td><td>${esc(role)}</td></tr>`).join("");
  $("activity").innerHTML = sortedAudit().filter(r => r.type !== "RESTORE").slice(0, 5).map(r =>
    `<tr><td>${fmtDT(r.at)}</td><td>${esc(r.actor)}</td><td>${esc(r.action)}</td><td>${esc(r.target)}</td></tr>`).join("");
}

// 시스템 보안 현황: '정상 운영 중'은 서버에 실제로 물어봄
async function drawSecurity(){
  const row = (icon, text) => `<li>${icon}<span>${text}</span></li>`;
  const render = state => {
    const okRun = state === "ok";
    $("checks").innerHTML = [
      row(state === "wait" ? ICON.wait : okRun ? ICON.ok : ICON.bad,
          state === "wait" ? "서버 확인 중" : okRun ? "정상 운영 중" : "서버 응답 없음"),
      row(ICON.ok, `최근 로그인: ${esc(MOCK.lastLogin)}`),
      row(MOCK.securityAlerts ? ICON.bad : ICON.ok, `보안 경고: ${MOCK.securityAlerts}건`),
    ].join("");
    $("secInfo").classList.toggle("bad", state === "bad");
    $("secText").textContent = state === "wait" ? "서버 상태를 확인하는 중이에요…"
      : okRun && !MOCK.securityAlerts ? "모든 시스템이 정상적으로 운영되고 있습니다."
      : "확인이 필요한 항목이 있습니다. 서버(uvicorn)가 켜져 있는지 확인해 주세요.";
  };
  render("wait");
  try {
    const r = await fetch("/api/info", {credentials: "same-origin"});
    if (r.status === 401) return location.replace("/login?next=/admin");
    render(r.ok ? "ok" : "bad");
  } catch (e) { render("bad"); }
}

// ───────── 회원관리 ─────────
const STATUS = {
  PENDING: {label: "승인 대기", desc: "가입 승인을 기다리는 회원"},
  IDENTITY_PENDING: {label: "신원 확인 대기", desc: "직원 신원 확인을 기다리는 회원"},
  ACTIVE: {label: "활성", desc: "현재 사용 중인 계정"},

};

const IDENTITY_DESC = {HR_VERIFIED: "인사 명부의 사번과 연결됨", DOC_CONFIRMED: "문서에서만 확인됨 (인사 명부 확인 전)", UNVERIFIED: "연결된 직원 정보 없음"};
const ROLE_LABEL = {STAFF: "일반 직원", TEAM_LEAD: "팀장", ADMIN: "관리자"};
const TEAMS = {};

const day = n => new Date(Date.now() - n * 864e5);
const ymd = d => `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
const ago = d => { const n = Math.round((Date.now() - d) / 864e5);
  return n < 1 ? "오늘" : n < 30 ? `${n}일 전` : n < 365 ? `약 ${Math.round(n / 30)}개월 전` : `약 ${Math.round(n / 365)}년 전`; };

// 연습용 회원 (이름은 성만, 이메일은 앞 글자만 보이게 가린 값. 실제 개인정보 없음)
let nextMemberId = 14;
const MEMBERS = [];
const mState = {tab: "", q: "", role: "", identity: ""};

// 역할별 기본 권한 (팀 SQL 초안 role_info 기본값과 같음)
const ROLE_DEFAULT = {STAFF: {scope: "OWN", restore: false}, TEAM_LEAD: {scope: "TEAM", restore: true}, ADMIN: {scope: "NONE", restore: false}};
MEMBERS.forEach(m => Object.assign(m, ROLE_DEFAULT[m.role]));

// ───────── 팀 권한 정책 ─────────
// 팀이 허용하는 최대 범위. 실제 권한 = 회원 개인 권한과 팀 정책 중 더 좁은 쪽 (연습용 기본값 — 팀 합의 필요)
// [검색 최대 범위, 금융정보 문서 검색, 개인정보 복원, 복원할 수 있는 항목]
const TEAM_POLICY = {};
const NO_TEAM_POLICY = {maxScope: "NONE", financial: false, restore: false, kinds: []};   // 팀 미지정은 가장 좁게
const SCOPE_RANK = {NONE: 0, OWN: 1, TEAM: 2};
const teamPolicy = id => TEAM_POLICY[id] || NO_TEAM_POLICY;

// 회원에게 실제로 적용되는 권한
function effective(m, over = {}){
  const s = {...m, ...over}, p = teamPolicy(s.team);
  const scope = SCOPE_RANK[s.scope] <= SCOPE_RANK[p.maxScope] ? s.scope : p.maxScope;
  const restore = s.restore && p.restore && scope !== "NONE" && s.identity === "HR_VERIFIED";
  return {scope, restore, kinds: restore ? p.kinds : [], financial: p.financial && scope !== "NONE",
          manage: s.role === "ADMIN", scopeCapped: scope !== s.scope, restoreCapped: s.restore && !restore,
          restoreWhy: !s.restore ? "" : !p.restore ? "팀 정책에서 복원을 막음" : scope === "NONE" ? "검색 범위 NONE"
            : s.identity !== "HR_VERIFIED" ? "신원 공식 확인 전" : ""};
}
// 팀 정책을 짧게 (표·안내용)
let policyText = p => `검색 최대 ${p.maxScope} · 금융 문서 ${p.financial ? "허용" : "거부"} · 복원 ${p.restore ? `허용(${p.kinds.map(k => PII_KIND[k]).join(", ")})` : "거부"}`;
// 사람이 읽는 '할 수 있는 일' 목록
function canDoList(e, teamName){
  return [
    [e.scope !== "NONE", e.scope === "TEAM" ? `${teamName} 문서를 검색할 수 있어요` : e.scope === "OWN" ? "자기가 담당한 문서만 검색할 수 있어요" : "문서를 검색할 수 없어요"],
    [e.financial, e.financial ? "금융정보(계좌·카드·주민번호)가 담긴 문서도 검색돼요" : "금융정보가 담긴 문서는 검색에서 빠져요"],
    [e.restore, e.restore ? `이름표를 실제 값으로 볼 수 있어요: ${e.kinds.map(k => PII_KIND[k]).join(", ")}` : "이름표(가명)만 볼 수 있어요"],
    [e.manage, e.manage ? "회원·권한·팀을 관리할 수 있어요" : "회원·권한은 관리할 수 없어요"],
  ];
}

function toast(text){
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400);
}
// ───────── 감사 기록 (활동기록 화면과 대시보드 '최근 활동 내역'이 함께 씀) ─────────

const AUDIT_TYPE = {
  APPROVE: "회원 승인", REJECT: "가입 거절", INVITE: "회원 초대", SUSPEND: "계정 정지", RESUME: "정지 해제",
  IDENTITY: "신원 확인", PERMISSION: "권한 변경", LINK: "직원 연결", UNLINK: "연결 해제", RESTORE: "개인정보 복원",
  TEAM_CREATE: "팀 생성", TEAM_POLICY: "팀 권한 변경", DETECT_FIX: "탐지 수정", DETECT_VIEW: "탐지 원문 보기",

const kindsText = k => Object.entries(k || {}).map(([t, n]) => `${PII_KIND[t]} ${n}개`).join(", ");
const fmtDT = d => `${ymd(d)} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
function addAudit(rec){
  AUDIT.push({id: auditSeq++, actor: "admin01", reason: "", detail: "", before: "", after: "", result: "", ...rec});
}
function logActivity(action, target, type, extra = {}){   // 화면에서 한 작업을 기록 (맨 앞에)
  addAudit({at: new Date(), type, action, target, ...extra});
  AUDIT.unsort = true;
}
const sortedAudit = () => { if (AUDIT.unsort){ AUDIT.sort((a, b) => b.at - a.at); AUDIT.unsort = false; } return AUDIT; };

// 임시 데이터 초기화를 사용하지 않습니다.


function drawMembers(){
  const count = s => MEMBERS.filter(m => !s || m.status === s).length;

      <td><button class="kebab" type="button" data-menu="${m.id}" aria-label="${esc(m.login)} 관리 메뉴" aria-haspopup="true">⋯</button></td>
    </tr>`).join("") : `<tr><td colspan="6" class="emptyRow">조건에 맞는 회원이 없어요.</td></tr>`;
  $("mCount").textContent = `${rows.length}명 표시 · 전체 ${MEMBERS.length}명`;
}

// 상태별로 할 수 있는 일
function actionsFor(m){
  const a = [["detail", "상세정보 보기"]];
  if (m.status === "PENDING") a.push(["approve", "가입 승인"], ["reject", "가입 거절", true]);
  if (m.status === "IDENTITY_PENDING") a.push(["identity", "신원 확인 완료"], ["suspend", "계정 정지", true]);
  if (m.status === "ACTIVE" && m.login !== "admin01") a.push(["suspend", "계정 정지", true]);
  if (m.status === "SUSPENDED") a.push(["resume", "정지 해제"]);
  if (!lockReason(m)) a.push(["perm", "권한 수정"]);       // 같은 페이지의 권한 탭으로
  return a;
}

function openMenu(btn){
  const m = MEMBERS.find(x => x.id === Number(btn.dataset.menu)), pop = $("rowMenu");
  pop.innerHTML = actionsFor(m).map(([k, label, warn]) =>
    `<button type="button" role="menuitem" data-act="${k}" data-id="${m.id}"${warn ? ' class="warn"' : ""}>${label}</button>`).join("");
  const b = btn.getBoundingClientRect();
  pop.classList.add("open");
  pop.style.top = Math.min(b.bottom + 4, innerHeight - pop.offsetHeight - 8) + "px";
  pop.style.left = Math.max(8, b.right - pop.offsetWidth) + "px";
  pop.querySelector("button").focus();
}

// 확인 창: fields 에 사유 등 입력칸, check 로 입력 검사 → 입력값을 돌려줌 (취소면 null)
function ask({title, text, fields = "", yes = "확인", danger = false, cancel = true, check = () => ""}){
  return new Promise(resolve => {
    $("dlgTitle").textContent = title; $("dlgText").innerHTML = text; $("dlgFields").innerHTML = fields;
    $("dlgNo").hidden = !cancel;
    $("dlgErr").textContent = ""; $("dlgYes").textContent = yes; $("dlgYes").classList.toggle("danger", danger);
    const dlg = $("dlg");
    const read = () => {   // 글자 칸은 값, 라디오는 고른 값, 체크박스는 고른 값 목록
      const v = {};
      $("dlgFields").querySelectorAll("[name]").forEach(el => {
        if (el.type === "checkbox"){ v[el.name] = v[el.name] || []; if (el.checked) v[el.name].push(el.value); }
        else if (el.type === "radio"){ if (el.checked) v[el.name] = el.value; else if (!(el.name in v)) v[el.name] = ""; }
        else v[el.name] = el.value.trim();
      });
      return v;
    };
    $("dlgForm").onsubmit = e => {
      e.preventDefault();
      const v = read(), err = check(v);
      if (err){ $("dlgErr").textContent = err; return; }
      dlg.close(); resolve(v);
    };
    $("dlgNo").onclick = () => { dlg.close(); resolve(null); };
    dlg.oncancel = () => resolve(null);
    dlg.showModal();
    ($("dlgFields").querySelector("[name]") || $("dlgNo")).focus();
  });
}
const reasonField = ph => `<label for="fReason">사유 (필수)</label><textarea id="fReason" name="reason" rows="3" maxlength="200" placeholder="${ph}"></textarea>`;
const needReason = v => v.reason ? "" : "사유를 적어 주세요. 활동 기록에 남아요.";

async function act(kind, id){
  const m = MEMBERS.find(x => x.id === id);
  if (!m) return;
  const now = new Date(), who = `<b>${esc(m.login)}</b> (${esc(m.name)})`;
  if (kind === "detail") return openDetail(m);
  if (kind === "perm"){ setMemberView("perm"); return openPermEdit(m); }

  if (kind === "approve"){
    const verified = m.identity === "HR_VERIFIED";
    const r = await ask({title: "가입을 승인할까요?", yes: "승인",
      text: `${who} 회원의 가입을 승인합니다.<br>` + (verified
        ? "직원 신원이 공식 확인되어 있어 바로 <b>활성</b> 계정이 됩니다."
        : `직원 신원이 아직 <b>${IDENTITY[m.identity]}</b> 상태라서 <b>신원 확인 대기</b>로 바뀝니다. 신원 확인이 끝나야 활성 계정이 됩니다.`)});
    if (!r) return;
    m.status = verified ? "ACTIVE" : "IDENTITY_PENDING";
    m.history.push({at: now, text: `가입 승인 (admin01) → ${STATUS[m.status].label}`});
    logActivity("계정 승인", m.login, "APPROVE", {before: "승인 대기", after: STATUS[m.status].label}); toast(`${m.login} 가입을 승인했어요 · ${STATUS[m.status].label}`);
  }
  if (kind === "reject"){
    const r = await ask({title: "가입을 거절할까요?", yes: "거절", danger: true, check: needReason,
      text: `${who} 회원의 가입 신청을 거절하고 목록에서 뺍니다.`, fields: reasonField("예: 직원 명부에 없는 신청자")});
    if (!r) return;
    MEMBERS.splice(MEMBERS.indexOf(m), 1);
    logActivity("가입 거절", m.login, "REJECT", {before: "승인 대기", after: "거절", reason: r.reason}); toast(`${m.login} 가입 신청을 거절했어요`);
  }
  if (kind === "identity"){
    const r = await ask({title: "직원 신원 확인을 완료할까요?", yes: "확인 완료",
      text: `${who} 회원이 직원 <b>${esc(m.employee_id || "(연결 안 됨)")}</b>와 같은 사람인지 <b>인사 명부의 사번으로 확인한 뒤</b> 눌러 주세요. 완료하면 활성 계정이 됩니다.`,
      fields: `<label for="fNo">확인한 사번</label><input id="fNo" name="employee_no" placeholder="예: SB123456" autocomplete="off">`,
      check: v => /^SB\d{6}$/.test(v.employee_no) ? "" : "사번을 SB + 숫자 6자리로 적어 주세요."});
    if (!r) return;
    m.identity = "HR_VERIFIED"; m.status = "ACTIVE";
    m.history.push({at: now, text: `직원 신원 확인 완료 (사번 ${r.employee_no}) → 활성`});
    logActivity("직원 신원 확인 완료", m.login, "IDENTITY", {before: "신원 확인 대기", after: "활성 · 공식 확인", detail: `사번 ${r.employee_no} 대조`}); toast(`${m.login} 신원 확인을 완료했어요 · 활성`);
  }
  if (kind === "suspend"){
    const r = await ask({title: "계정을 정지할까요?", yes: "정지", danger: true, check: needReason,
      text: `${who} 계정을 정지하면 로그인과 검색을 할 수 없어요.`, fields: reasonField("예: 비정상 접근 시도, 퇴사 예정")});
    if (!r) return;
    m.status = "SUSPENDED";
    m.history.push({at: now, text: `계정 정지 (admin01) · 사유: ${r.reason}`});
    logActivity("회원 정지", m.login, "SUSPEND", {before: "활성", after: "정지", reason: r.reason}); toast(`${m.login} 계정을 정지했어요`);
  }
  if (kind === "resume"){
    const r = await ask({title: "정지를 해제할까요?", yes: "정지 해제", check: needReason,
      text: `${who} 계정을 다시 사용할 수 있게 합니다.`, fields: reasonField("예: 본인 확인 완료")});
    if (!r) return;
    m.status = m.identity === "HR_VERIFIED" ? "ACTIVE" : "IDENTITY_PENDING";
    m.history.push({at: now, text: `정지 해제 (admin01) · 사유: ${r.reason} → ${STATUS[m.status].label}`});
    logActivity("정지 해제", m.login, "RESUME", {before: "정지", after: STATUS[m.status].label, reason: r.reason}); toast(`${m.login} 정지를 해제했어요 · ${STATUS[m.status].label}`);
  }
  if ($("sheet").classList.contains("open") && kind !== "reject") openDetail(m); else closeDetail();
  drawMembers();
}

const SCOPE = {OWN: ["OWN", "내 담당 문서"], TEAM: ["TEAM", "우리 팀 문서"], NONE: ["NONE", "검색 안 함"]};
const PERM_LOG = [];                  // 권한 변경 기록 (연습용 — 실제로는 서버의 permission_change_log)
let pQuery = "", editingId = null;

const teamName = id => TEAMS[id] || "미지정";
const restoreText = v => v ? "허용" : "거부";
const isDefault = m => m.scope === ROLE_DEFAULT[m.role].scope && m.restore === ROLE_DEFAULT[m.role].restore;
function lockReason(m){
  if (m.status === "PENDING") return "가입 승인 후에 권한을 정할 수 있어요";
  if (m.status === "SUSPENDED") return "정지된 계정은 정지를 해제한 뒤에 바꿀 수 있어요";
  return "";
}

function drawRoles(){
  const shield = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 5v6c0 5 3.4 9.5 8 11 4.6-1.5 8-6 8-11V5z"/></svg>`;
  const users = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="3.5"/><path d="M2 19c0-3.9 3.1-6 7-6s7 2.1 7 6v1H2z"/><circle cx="17" cy="8.5" r="2.8"/><path d="M17.5 13c3 .2 4.5 2 4.5 5v2h-4v-1c0-2.4-.9-4.4-2.4-5.6.6-.3 1.2-.4 1.9-.4z"/></svg>`;
  const clock = `<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
  $("pStats").innerHTML = [
    [shield, "전체 역할", Object.keys(ROLE_DEFAULT).length],
    [users, "권한이 있는 회원", MEMBERS.filter(m => !lockReason(m)).length],
    [clock, "기본값과 다른 권한", MEMBERS.filter(m => !lockReason(m) && !isDefault(m)).length],
  ].map(([ic, t, n]) => `<div class="bstat"><span class="ic" aria-hidden="true">${ic}</span><div class="t">${t}</div><div class="n">${n}</div></div>`).join("");

  const q = pQuery.trim().toLowerCase();
  const rows = MEMBERS.filter(m => !q || [m.login, teamName(m.team), m.role, ROLE_LABEL[m.role]].some(v => v.toLowerCase().includes(q)))
    .sort((a, b) => (lockReason(a) ? 1 : 0) - (lockReason(b) ? 1 : 0) || a.login.localeCompare(b.login));
  const STATUS_DOT = {ACTIVE: "#5B8C5A", IDENTITY_PENDING: "#8E5B9F", PENDING: "#E8892B", SUSPENDED: "#B43B3B"};  // 어흥이 테마 색
  $("pBody").innerHTML = rows.length ? rows.map(m => {
    const lock = lockReason(m), def = ROLE_DEFAULT[m.role], eff = effective(m);
    return `<tr class="${m.id === editingId ? "sel" : ""}${lock ? " locked" : ""}">
      <td><div class="who"><span class="av2" aria-hidden="true">${esc(m.login.slice(-2).toUpperCase())}</span>
        <button type="button" class="linkBtn" data-member-open="${m.id}" title="회원 상세 보기">${esc(m.login)}</button></div></td>
      <td><span class="tag2 r-${m.role}">${m.role}</span></td>
      <td>${esc(teamName(m.team))}</td>
      <td><span class="scope">${m.scope}</span>${m.scope !== def.scope ? '<span class="diffMark">기본값과 다름</span>' : ""}
        ${eff.scopeCapped ? `<small class="capNote" style="display:block">팀 정책으로 실제 ${eff.scope}</small>` : ""}</td>
      <td><span class="${m.restore ? "rs-yes" : "rs-no"}">${restoreText(m.restore)}</span>${m.restore !== def.restore ? '<span class="diffMark">기본값과 다름</span>' : ""}
        ${eff.restoreCapped && !lock ? `<small class="capNote" style="display:block">실제로는 막힘: ${esc(eff.restoreWhy)}</small>` : ""}</td>
      <td><span class="dot2" style="color:${STATUS_DOT[m.status]}"><i></i>${STATUS[m.status].label}</span></td>

    </tr>`;
  }).join("") : `<tr><td colspan="7" class="emptyRow">조건에 맞는 회원이 없어요.</td></tr>`;
}

// 저장하면 안 되는 조합
function permErrors(m, n){
  const e = [];
  if (m.login === "admin01" && n.role !== "ADMIN") e.push("관리자 본인의 ADMIN 역할은 뺄 수 없어요.");
  if (n.scope === "TEAM" && !n.team) e.push("검색 범위 TEAM은 소속 팀이 있어야 해요.");
  if (n.scope === "OWN" && !m.employee_id) e.push("검색 범위 OWN은 연결된 직원이 있어야 해요 (회원 목록 탭에서 신원 확인 먼저).");
  if (n.restore && n.scope === "NONE") e.push("검색 범위가 NONE이면 개인정보 복원 권한을 줄 수 없어요.");
  if (n.restore && m.identity !== "HR_VERIFIED") e.push("직원 신원이 공식 확인된 회원만 개인정보 복원 권한을 받을 수 있어요.");
  return e;
}
// 저장은 되지만 한 번 더 알려 줄 것
function permWarnings(m, n){
  const w = [], def = ROLE_DEFAULT[n.role];
  if (n.restore && !m.restore) w.push("이름표(가명)를 실제 개인정보로 바꿔 볼 수 있게 됩니다.");
  if (n.scope === "TEAM" && m.scope !== "TEAM") w.push(`${teamName(n.team)} 문서 전체를 검색할 수 있게 됩니다.`);
  if (n.role === "ADMIN" && m.role !== "ADMIN") w.push("회원과 권한을 관리할 수 있게 됩니다.");
  if (n.scope !== def.scope || n.restore !== def.restore) w.push(`${n.role} 역할의 기본값(${def.scope}, 복원 ${restoreText(def.restore)})과 다른 권한이에요.`);
  const e = effective(m, n);
  if (e.scopeCapped) w.push(`${teamName(n.team)} 팀 정책 때문에 검색은 실제로 ${e.scope}까지만 돼요.`);
  if (e.restoreCapped) w.push(`복원을 허용해도 실제로는 막혀요: ${e.restoreWhy}.`);
  if (e.restore) w.push(`복원할 수 있는 항목(팀 정책): ${e.kinds.map(k => PII_KIND[k]).join(", ")}`);
  return w;
}

    <form class="pform" id="pForm" novalidate>
      <fieldset><legend>역할</legend><div class="seg" id="fRoleSeg">
        ${Object.keys(ROLE_DEFAULT).map(r => radio("role", r, r, ROLE_LABEL[r], m.role === r)).join("")}</div>
        <div class="fhint" id="roleHint">역할을 바꾸면 검색 범위와 복원 권한이 그 역할의 기본값으로 바뀌어요.</div></fieldset>
      <div><label class="lbl" for="fTeam">소속 팀</label>
        <select id="fTeam" name="team"><option value="">미지정</option>${Object.entries(TEAMS).map(([k, v]) => `<option value="${esc(k)}"${m.team === k ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>
        <div class="fhint" id="teamHint"></div></div>
      <fieldset><legend>검색 범위</legend><div class="seg">
        ${Object.entries(SCOPE).map(([k, [t, sub]]) => radio("scope", k, t, sub, m.scope === k)).join("")}</div></fieldset>
      <fieldset><legend>개인정보 복원 권한</legend><div class="seg two" id="fRestoreSeg">
        ${radio("restore", "1", "허용", "실명으로 되돌려 보기", m.restore)}${radio("restore", "0", "거부", "이름표(가명)만 보기", !m.restore)}</div>
        <div class="fhint" id="restoreHint"></div></fieldset>
      <div><label class="lbl" for="fWhy">변경 사유 (필수)</label>
        <textarea id="fWhy" name="reason" rows="2" maxlength="200" placeholder="예: 팀장 발령, 업무 변경"></textarea></div>
      <div class="ferr" id="pErr" role="alert"></div>
    </form>
    <div class="sheetActs">
      <button type="button" class="ghostBtn" data-sheet-close>취소</button>
      <button type="submit" class="primaryBtn" form="pForm" style="flex:1">변경 내용 확인</button>
    </div>`;
  const form = $("pForm");
  const read = () => ({role: form.role.value, team: form.team.value, scope: form.scope.value, restore: form.restore.value === "1", reason: form.reason.value.trim()});
  const refresh = () => {   // 지금 고른 값으로 안 되는 선택지를 미리 막고 이유를 보여 줌
    const n = read(), allow = form.querySelector('input[name=restore][value="1"]');
    const why = m.identity !== "HR_VERIFIED" ? "직원 신원이 공식 확인되지 않아 복원 권한을 줄 수 없어요."
      : n.scope === "NONE" ? "검색 범위가 NONE이면 복원 권한을 줄 수 없어요." : "";
    allow.disabled = !!why;
    if (why && allow.checked){ form.querySelector('input[name=restore][value="0"]').checked = true; }
    $("restoreHint").textContent = why || "검색 권한과 복원 권한은 따로예요. 문서를 찾을 수 있어도 실명은 이 권한이 있어야 보여요.";
    $("restoreHint").className = "fhint" + (why ? " warn" : "");
    // 소속 팀 정책과, 그 정책 때문에 실제로 적용될 권한
    const e = effective(m, read());
    $("teamHint").innerHTML = `팀 정책: ${esc(policyText(teamPolicy(n.team)))}`
      + (e.scopeCapped || e.restoreCapped ? `<br><span style="color:#B5650F">→ 실제 적용: 검색 ${e.scope}, 복원 ${e.restore ? "허용" : "거부"}${e.restoreCapped && e.restoreWhy ? ` (${esc(e.restoreWhy)})` : ""}</span>` : "");
  };
  form.querySelectorAll("input[name=role]").forEach(r => r.addEventListener("change", () => {
    const d = ROLE_DEFAULT[form.role.value];
    form.querySelector(`input[name=scope][value="${d.scope}"]`).checked = true;
    form.querySelector(`input[name=restore][value="${d.restore ? 1 : 0}"]`).checked = true;
    $("roleHint").textContent = `${form.role.value} 기본값으로 바꿨어요: 검색 범위 ${d.scope}, 복원 ${restoreText(d.restore)}`;
    refresh();
  }));
  form.querySelectorAll("input[name=scope]").forEach(r => r.addEventListener("change", refresh));
  form.querySelectorAll("input[name=restore]").forEach(r => r.addEventListener("change", refresh));
  form.team.addEventListener("change", refresh);
  form.onsubmit = e => { e.preventDefault(); savePerm(m, read()); };
  refresh();
  $("sheet").classList.add("open"); $("sheet").setAttribute("aria-hidden", "false");
  form.querySelector("input[name=role]:checked").focus();
}

async function savePerm(m, n){
  $("pErr").textContent = "";
  const changes = [
    ["역할", m.role, n.role],
    ["소속 팀", teamName(m.team), teamName(n.team)],
    ["검색 범위", `${m.scope} (${SCOPE[m.scope][1]})`, `${n.scope} (${SCOPE[n.scope][1]})`],
    ["개인정보 복원", restoreText(m.restore), restoreText(n.restore)],
  ].filter(([, a, b]) => a !== b);
  if (!changes.length){ $("pErr").textContent = "바뀐 내용이 없어요."; return; }
  const errors = permErrors(m, n);
  if (errors.length){ $("pErr").innerHTML = errors.map(esc).join("<br>"); return; }
  if (!n.reason){ $("pErr").textContent = "변경 사유를 적어 주세요. 권한 변경 기록에 남아요."; $("fWhy").focus(); return; }

  const warnings = permWarnings(m, n);
  const ok = await ask({title: "권한을 이렇게 바꿀까요?", yes: "변경 저장", danger: n.restore && !m.restore,
    text: `<b>${esc(m.login)}</b> 회원의 권한이 아래처럼 바뀌어요.`,
    fields: `<ul class="diffList">${changes.map(([k, a, b]) => `<li><span class="k">${k}</span><span><del>${esc(a)}</del> → <ins>${esc(b)}</ins></span></li>`).join("")}</ul>
      ${warnings.length ? `<div class="warnBox">⚠️ 확인해 주세요<ul>${warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}
      <p style="margin:0 0 8px">사유: ${esc(n.reason)}</p>`});
  if (!ok) return;

  const summary = changes.map(([k, a, b]) => `${k} ${a} → ${b}`).join(", ");
  Object.assign(m, {role: n.role, team: n.team, scope: n.scope, restore: n.restore});
  m.history.push({at: new Date(), text: `권한 변경 (admin01) · ${summary} · 사유: ${n.reason}`});
  PERM_LOG.unshift({at: new Date(), login: m.login, summary, reason: n.reason});
  logActivity(`권한 변경 (${changes.map(([k, a, b]) => `${k} ${a}→${b}`).join(", ")})`, m.login, "PERMISSION",
    {before: changes.map(([k, a]) => `${k} ${a}`).join(", "), after: changes.map(([k, , b]) => `${k} ${b}`).join(", "), reason: n.reason});
  editingId = null; closeDetail(); drawRoles();
  toast(`${m.login} 권한을 바꿨어요`);
}

function exportPerms(){   // 이름·이메일은 빼고 권한 정보만
  const head = ["아이디", "역할", "소속 팀", "검색 범위", "개인정보 복원", "계정 상태", "직원 신원 확인"];
  const lines = [head, ...MEMBERS.map(m => [m.login, m.role, teamName(m.team), m.scope, restoreText(m.restore), STATUS[m.status].label, IDENTITY[m.identity]])]
    .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"}));
  a.download = `회원권한_${ymd(new Date()).replace(/\./g, "")}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("권한 목록을 CSV로 내보냈어요 (이름·이메일 제외)");
}

function bindRoles(){
  drawRoles();

  $("qDefaults").onclick = () => ask({title: "역할별 기본 권한", yes: "닫기", cancel: false,
    text: "역할을 정하면 아래 값이 먼저 들어가요. 필요하면 회원마다 바꿀 수 있지만, 바꾸면 '기본값과 다름'으로 표시돼요.",
    fields: `<ul class="diffList">${Object.entries(ROLE_DEFAULT).map(([r, d]) =>
      `<li><span class="k">${r}</span><span>${ROLE_LABEL[r]} · 검색 ${d.scope} (${SCOPE[d.scope][1]}) · 복원 ${restoreText(d.restore)}</span></li>`).join("")}</ul>`});
  $("qHistory").onclick = () => ask({title: "권한 변경 기록", yes: "닫기", cancel: false,
    text: PERM_LOG.length ? "이 화면에서 바꾼 권한이에요 (최근 순)." : "아직 바꾼 권한이 없어요.",
    fields: PERM_LOG.length ? `<ul class="hist" style="margin:0 0 8px">${PERM_LOG.map(l =>
      `<li><time>${ymd(l.at)} ${String(l.at.getHours()).padStart(2, "0")}:${String(l.at.getMinutes()).padStart(2, "0")}</time><b>${esc(l.login)}</b> · ${esc(l.summary)}<br><small style="color:var(--ink3)">사유: ${esc(l.reason)}</small></li>`).join("")}</ul>` : ""});
}

// ───────── 팀 관리 ─────────
const EMP_STATUS = {OFFICIAL: "공식 확인", DOC_CONFIRMED: "문서 확인", EMPLOYEE_CANDIDATE: "직원 후보", UNRESOLVED: "미확정"};
const EMP_DESC = {
  OFFICIAL: "인사 명부의 사번으로 확인된 직원",
  DOC_CONFIRMED: "문서의 소속 서식·사번으로 직원임이 확인됨 (공식 확인 전)",
  EMPLOYEE_CANDIDATE: "직원일 가능성만 있음 (팀이 없거나 이름만 표기)",
  UNRESOLVED: "근거가 서로 충돌해 판단 보류",
};
const tState = {view: "emp", q: "", team: "", status: "", linked: false, sel: null};

// 연습용 회원의 직원 ID를 실제 명부의 같은 팀 직원에 맞춤 (문서 확인 직원 먼저)
// 임시 데이터 초기화를 사용하지 않습니다.


const linkedMember = e => MEMBERS.find(m => m.employee_id === e.id);
// 공식 확인 = 인사 명부로 확인됨 (명부 값, 또는 회원관리에서 사번으로 '신원 확인 완료'한 회원과 연결됨)
const empStatus = e => (e.official === "HR_VERIFIED" || linkedMember(e)?.identity === "HR_VERIFIED") ? "OFFICIAL" : e.status;
const empRank = e => [e.position, e.title].filter(Boolean).join(" · ") || "직급 미확인";

function teamFilterOptions(){
  return `<option value="">모든 팀</option>${Object.entries(TEAMS).map(([k, v]) => `<option value="${esc(k)}">${esc(v)}</option>`).join("")}<option value="NONE">팀 미확인</option>`;
}

function drawTeams(){
  const by = s => EMPLOYEES.filter(e => empStatus(e) === s).length;
  if (EMPLOYEES.length){   // 진짜 명부 숫자와 연습용 회원에서 온 숫자를 구분해서 알려 줌
    const realOfficial = EMPLOYEES.filter(e => e.official === "HR_VERIFIED").length;
    $("tSource").textContent = `직원 데이터: ${EMPLOYEE_SOURCE.file} (${EMPLOYEE_SOURCE.made} 기준, 이름 제외 ${EMPLOYEE_SOURCE.count}명) · `
      + `실제 명부의 공식 확인은 ${realOfficial}명이고, '공식 확인' ${by("OFFICIAL") - realOfficial}명은 연습용 회원(회원·권한 관리에서 사번 확인)과 연결된 직원이에요. 회원 연결은 모두 연습용이에요.`;
  }
  const linked = EMPLOYEES.filter(linkedMember).length;
  const ic = {
    all: `<svg viewBox="0 0 24 24" fill="none" stroke="#1B2333" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c2 .6 3 2.3 3 5.4"/></svg>`,
    off: `<svg viewBox="0 0 24 24" fill="none" stroke="#21A56B" stroke-width="2.2"><path d="M12 3 5 6v5c0 4.5 3 8 7 9.5 4-1.5 7-5 7-9.5V6z"/><path d="m9 12 2 2 4-4"/></svg>`,
    doc: `<svg viewBox="0 0 24 24" fill="none" stroke="#2F6BFF" stroke-width="2"><path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h4"/></svg>`,
    cand: `<svg viewBox="0 0 24 24" fill="none" stroke="#E8892B" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-5.5 6-5.5 1.3 0 2.5.3 3.4.8M18 14v6M15 17h6"/></svg>`,
    unres: `<svg viewBox="0 0 24 24" fill="none" stroke="#D64545" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5" stroke-linecap="round"/></svg>`,
    link: `<svg viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>`,
    team: `<svg viewBox="0 0 24 24" fill="none" stroke="#1F6B5A" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>`,
  };
  const tiles = [
    ["", ic.all, EMPLOYEES.length, "전체 직원"],
    ["OFFICIAL", ic.off, by("OFFICIAL"), "공식 확인"],
    ["DOC_CONFIRMED", ic.doc, by("DOC_CONFIRMED"), "문서 확인"],
    ["EMPLOYEE_CANDIDATE", ic.cand, by("EMPLOYEE_CANDIDATE"), "직원 후보"],
    ["UNRESOLVED", ic.unres, by("UNRESOLVED"), "미확정"],
    ["LINKED", ic.link, linked, "회원 연결됨"],
    ["TEAMS", ic.team, Object.keys(TEAMS).length, "팀"],
  ];
  $("tTiles").innerHTML = tiles.map(([k, svg, n, l]) => {
    const on = k === "TEAMS" ? tState.view === "team" : k === "LINKED" ? tState.linked && tState.view === "emp"
      : tState.view === "emp" && !tState.linked && tState.status === k;
    return `<button type="button" class="stile" data-tile="${k}" aria-pressed="${on}">${svg}<span class="n">${n}</span><span class="l">${l}</span></button>`;
  }).join("");

  $("tEmpView").hidden = tState.view !== "emp"; $("tTeamView").hidden = tState.view !== "team";
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-selected", b.dataset.view === tState.view));
  if (tState.view === "team") return drawTeamList();

  const q = tState.q.trim().toLowerCase();
  const rows = EMPLOYEES.filter(e => {
    const lm = linkedMember(e);
    return (!tState.team || (tState.team === "NONE" ? !e.team_id : e.team_id === tState.team))
      && (!tState.status || empStatus(e) === tState.status) && (!tState.linked || lm)

  const order = {UNRESOLVED: 0, OFFICIAL: 1, DOC_CONFIRMED: 2, EMPLOYEE_CANDIDATE: 3};
  rows.sort((a, b) => order[empStatus(a)] - order[empStatus(b)] || (a.team_id || "T99").localeCompare(b.team_id || "T99") || a.id.localeCompare(b.id));

  }).join("") : `<tr><td colspan="5" class="emptyRow">조건에 맞는 직원이 없어요.</td></tr>`;
  drawEmpCard();
}

function drawTeamList(){

    const es = EMPLOYEES.filter(e => (e.team_id || "") === id), c = s => es.filter(e => empStatus(e) === s).length;
    return {id, name, doc: c("DOC_CONFIRMED") + c("OFFICIAL"), cand: c("EMPLOYEE_CANDIDATE"), unres: c("UNRESOLVED"),
            members: MEMBERS.filter(m => (m.team || "") === id).length, total: es.length};
  });
  $("tTeamBody").innerHTML = rows.map(r => {
    const meta = TEAM_META[r.id], p = teamPolicy(r.id);
    return `<tr${r.id && r.id === tState.newTeam ? ' class="sel"' : ""}>

      ${meta ? ' <span class="diffMark" style="background:var(--blue-bg);color:var(--blue)">새 팀</span>' : ""}
      ${meta?.desc ? `<small style="display:block;color:var(--ink3)">${esc(meta.desc)}</small>` : ""}</td>
    <td class="ev">${r.id || "—"}</td>
    <td>${r.doc} · ${r.cand} · ${r.unres ? `<span class="st st-UNRESOLVED">${r.unres}</span>` : 0}</td>
    <td>${r.members}명</td>
    <td>${policyChips(p)}${r.id ? "" : '<small style="display:block;color:var(--ink3)">팀이 없으면 가장 좁게</small>'}</td>
    <td>${meta ? `${ymd(meta.created)} <small style="color:var(--ink3)">· ${esc(meta.by)}</small>` : '<span style="color:var(--ink3)">문서 명부</span>'}</td>
    <td style="white-space:nowrap">${r.id ? `<button class="editBtn" type="button" data-team-policy="${esc(r.id)}">권한 설정</button> ` : ""}<button class="editBtn" type="button" data-team-go="${r.id || "NONE"}" ${r.total ? "" : "disabled"}>직원 ${r.total}명 보기</button></td></tr>`;
