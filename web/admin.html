}

let policyChips = p => `<span class="pchip scope" title="문서 검색 최대 범위">검색 ${p.maxScope}</span>`
  + `<span class="pchip${p.financial ? " on" : ""}" title="금융정보 문서 검색">금융 ${p.financial ? "O" : "X"}</span>`
  + `<span class="pchip${p.restore ? " on" : ""}" title="${p.restore ? "복원 가능: " + p.kinds.map(k => PII_KIND[k]).join(", ") : "복원 불가"}">복원 ${p.restore ? p.kinds.length + "종" : "X"}</span>`;

// ── 팀 권한 입력칸 (팀 만들기·권한 설정에서 함께 씀) ──
function policyFields(p){
  const radio = (name, value, label, sub, on) => `<label><input type="radio" name="${name}" value="${value}"${on ? " checked" : ""}>${label}${sub ? `<small>${sub}</small>` : ""}</label>`;
  return `<fieldset><legend>문서 검색 최대 범위</legend><div class="seg">
      ${radio("maxScope", "TEAM", "TEAM", "팀 문서까지", p.maxScope === "TEAM")}${radio("maxScope", "OWN", "OWN", "내 담당 문서만", p.maxScope === "OWN")}${radio("maxScope", "NONE", "NONE", "검색 안 함", p.maxScope === "NONE")}</div></fieldset>
    <fieldset><legend>금융정보 문서 검색 (계좌·카드·주민번호가 담긴 문서)</legend><div class="seg two">
      ${radio("financial", "1", "허용", "", p.financial)}${radio("financial", "0", "거부", "", !p.financial)}</div></fieldset>
    <fieldset><legend>개인정보 복원</legend><div class="seg two">
      ${radio("restore", "1", "허용", "팀원이 실제 값을 볼 수 있음", p.restore)}${radio("restore", "0", "거부", "이름표만", !p.restore)}</div></fieldset>
    <fieldset><legend>복원할 수 있는 항목</legend><div class="kinds${p.restore ? "" : " off"}" id="pkKinds">
      ${Object.entries(PII_KIND).map(([k, v]) => `<label><input type="checkbox" name="kinds" value="${k}"${p.kinds.includes(k) ? " checked" : ""}>${v}</label>`).join("")}</div></fieldset>`;
}
function bindPolicyFields(){   // 복원 '거부'면 항목 체크를 잠금
  const box = $("dlgFields"), kinds = box.querySelectorAll("input[name=kinds]");
  const sync = () => {
    const on = box.querySelector("input[name=restore]:checked")?.value === "1";
    kinds.forEach(k => k.disabled = !on); $("pkKinds")?.classList.toggle("off", !on);
  };
  box.querySelectorAll("input[name=restore]").forEach(r => r.addEventListener("change", sync)); sync();
}
const readPolicy = v => ({maxScope: v.maxScope, financial: v.financial === "1", restore: v.restore === "1",
                          kinds: v.restore === "1" ? Object.keys(PII_KIND).filter(k => (v.kinds || []).includes(k)) : []});
function policyCheck(v){
  if (v.restore === "1" && v.maxScope === "NONE") return "검색 범위가 NONE이면 개인정보 복원을 허용할 수 없어요.";
  if (v.restore === "1" && !(v.kinds || []).length) return "복원을 허용하려면 복원할 수 있는 항목을 하나 이상 골라 주세요.";
  return "";
}
function policyDiff(a, b){
  return [["검색 최대 범위", a.maxScope, b.maxScope], ["금융 문서", a.financial ? "허용" : "거부", b.financial ? "허용" : "거부"],
          ["개인정보 복원", a.restore ? "허용" : "거부", b.restore ? "허용" : "거부"],
          ["복원 항목", a.kinds.map(k => PII_KIND[k]).join(", ") || "없음", b.kinds.map(k => PII_KIND[k]).join(", ") || "없음"]];
}
// 이 정책으로 바꾸면 팀원에게 생기는 변화
function policyImpact(id, next){
  const ms = MEMBERS.filter(m => m.team === id);
  const lost = ms.filter(m => effective(m).restore && !effectiveWith(m, next).restore).map(m => m.login);
  const narrowed = ms.filter(m => SCOPE_RANK[effectiveWith(m, next).scope] < SCOPE_RANK[effective(m).scope]).map(m => m.login);
  return {count: ms.length, lost, narrowed};
}
function effectiveWith(m, policy){   // 팀 정책을 잠깐 바꿔서 계산
  const saved = TEAM_POLICY[m.team]; TEAM_POLICY[m.team] = policy;
  try { return effective(m); } finally { if (saved) TEAM_POLICY[m.team] = saved; else delete TEAM_POLICY[m.team]; }
}

// ── 팀 만들기 (1 이름 → 2 권한 → 3 확인) ──
const TEAM_META = {};   // 이 화면에서 만든 팀: {설명, 만든 날, 만든 사람}
const nameKey = s => s.replace(/\s+/g, "").toLowerCase();
const nextTeamId = () => `T${String(Math.max(0, ...Object.keys(TEAMS).filter(k=>/^T[0-9]+$/.test(k)).map(k=>Number(k.slice(1))))+1).padStart(2,"0")}`;

async function createTeam(){
  const id = nextTeamId();
  const r = await ask({title: "새 팀 만들기 (1/3) · 팀 정보", yes: "다음: 팀 권한",
    text: `팀 ID는 <b>${id}</b>로 자동으로 정해져요. 만든 팀은 소속 팀 목록(회원·권한 관리·직원 필터)에 바로 나타나요.`,
    fields: `<label for="ntName">팀 이름 (필수)</label><input id="ntName" name="name" maxlength="20" placeholder="예: 개인정보보호팀" autocomplete="off">
      <label for="ntDesc" style="margin-top:8px">설명 (선택)</label><input id="ntDesc" name="desc" maxlength="60" placeholder="예: 개인정보 처리 점검과 교육 담당">
      <label for="ntWhy" style="margin-top:8px">만드는 사유 (필수)</label><textarea id="ntWhy" name="reason" rows="2" maxlength="200" placeholder="예: 조직 개편으로 신설"></textarea>`,
    check: v => {
      if (v.name.length < 2) return "팀 이름을 2자 이상 적어 주세요.";
      if (!/^[가-힣A-Za-z0-9 ]+$/.test(v.name)) return "팀 이름에는 한글·영문·숫자·띄어쓰기만 쓸 수 있어요.";
      const dup = Object.values(TEAMS).find(t => nameKey(t) === nameKey(v.name));
      if (dup) return `같은 이름의 팀이 이미 있어요: ${dup} (띄어쓰기만 다른 이름도 같은 팀으로 봐요)`;
      return v.reason ? "" : "만드는 사유를 적어 주세요. 활동기록에 남아요.";
    }});
  if (!r) return;
  const start = {maxScope: "TEAM", financial: false, restore: false, kinds: []};   // 새 팀은 좁게 시작
  const pv = await askPolicy(`새 팀 만들기 (2/3) · ${r.name} 팀 권한`, start, "다음: 확인",
    "이 팀 회원이 받을 수 있는 <b>최대 권한</b>이에요. 처음에는 좁게 시작하는 걸 권해요(금융 문서·복원 거부).");
  if (!pv) return;
  const policy = readPolicy(pv);
  const ok = await ask({title: "새 팀 만들기 (3/3) · 이렇게 만들까요?", yes: "팀 만들기",
    text: "아래 내용으로 새 팀을 만들어요.",
    fields: `<ul class="diffList">
      <li><span class="k">팀 ID</span><span><ins>${id}</ins></span></li>
      <li><span class="k">팀 이름</span><span><ins>${esc(r.name)}</ins></span></li>
      <li><span class="k">설명</span><span>${esc(r.desc || "—")}</span></li>
      <li><span class="k">팀 권한</span><span>${esc(policyText(policy))}</span></li>
      <li><span class="k">사유</span><span>${esc(r.reason)}</span></li></ul>
      ${policy.restore ? `<div class="warnBox">⚠️ 이 팀 회원 중 개인 복원 권한과 신원 공식 확인이 있는 사람은 ${esc(policy.kinds.map(k => PII_KIND[k]).join(", "))}을(를) 실제 값으로 볼 수 있게 돼요.</div>` : ""}
      <div class="warnBox">새 팀에는 아직 직원이 없어요. 직원의 소속은 문서·인사 명부로 확인하고, 회원의 소속 팀은 회원·권한 관리의 권한 탭에서 바꿀 수 있어요.</div>`});
  if (!ok) return;
  TEAMS[id] = r.name;
  TEAM_POLICY[id] = policy;
  TEAM_META[id] = {desc: r.desc, created: new Date(), by: "admin01"};
  logActivity("팀 생성", `${id} ${r.name}`, "TEAM_CREATE", {after: `${id} · ${r.name} · ${policyText(policy)}`, detail: r.desc, reason: r.reason});
  Object.assign(tState, {view: "team", newTeam: id});
  $("tTeam").innerHTML = teamFilterOptions(); $("tTeam").value = tState.team;
  toast(`'${r.name}' 팀(${id})을 만들었어요`);
  drawTeams();
}

function askPolicy(title, p, yes, text, extraFields = ""){
  const pending = ask({title, yes, text, fields: policyFields(p) + extraFields, check: v => policyCheck(v) || (extraFields && !v.reason ? "변경 사유를 적어 주세요. 활동기록에 남아요." : "")});
  bindPolicyFields();
  return pending;
}

// ── 기존 팀 권한 바꾸기 ──
async function editTeamPolicy(id){
  const now = teamPolicy(id);
  const v = await askPolicy(`${TEAMS[id]} (${id}) 팀 권한 설정`, now, "변경 내용 확인",
    "이 팀 회원이 받을 수 있는 최대 권한을 정해요. 회원 개인 권한보다 좁으면 팀 정책이 이겨요.",
    `<label for="tpWhy">변경 사유 (필수)</label><textarea id="tpWhy" name="reason" rows="2" maxlength="200" placeholder="예: 업무 범위 변경"></textarea>`);
  if (!v) return;
  const next = readPolicy(v);
  const changes = policyDiff(now, next).filter(([, a, b]) => a !== b);
  if (!changes.length){ toast("바뀐 내용이 없어요"); return; }
  const imp = policyImpact(id, next);
  const ok = await ask({title: "팀 권한을 이렇게 바꿀까요?", yes: "변경 저장", danger: next.restore && !now.restore,
    text: `<b>${esc(TEAMS[id])}</b> 팀의 권한이 바뀌고, 이 팀 회원 <b>${imp.count}명</b>에게 바로 적용돼요.`,
    fields: `<ul class="diffList">${changes.map(([k, a, b]) => `<li><span class="k">${k}</span><span><del>${esc(a)}</del> → <ins>${esc(b)}</ins></span></li>`).join("")}</ul>
      ${imp.lost.length || imp.narrowed.length ? `<div class="warnBox">⚠️ 영향을 받는 회원<ul>
        ${imp.lost.length ? `<li>복원 권한이 꺼짐: ${esc(imp.lost.join(", "))}</li>` : ""}
        ${imp.narrowed.length ? `<li>검색 범위가 좁아짐: ${esc(imp.narrowed.join(", "))}</li>` : ""}</ul></div>` : ""}
      ${next.restore && !now.restore ? `<div class="warnBox">⚠️ 이 팀에서 개인정보 복원이 가능해져요. 실제로는 회원 개인 권한과 신원 공식 확인도 있어야 해요.</div>` : ""}
      <p style="margin:0 0 8px">사유: ${esc(v.reason)}</p>`});
  if (!ok) return;
  TEAM_POLICY[id] = next;
  logActivity(`팀 권한 변경 (${changes.map(([k, a, b]) => `${k} ${a}→${b}`).join(", ")})`, `${id} ${TEAMS[id]}`, "TEAM_POLICY",
    {before: changes.map(([k, a]) => `${k} ${a}`).join(", "), after: changes.map(([k, , b]) => `${k} ${b}`).join(", "), reason: v.reason});
  toast(`${TEAMS[id]} 팀 권한을 바꿨어요`);
  drawTeams();
  if ($("sheet").classList.contains("open")) openTeamSheet(id);
}

// ── 이 팀 직원이 할 수 있는 일 ──

      ${e.scopeCapped ? `<div class="capNote">⚠️ 개인 권한은 ${m.scope}지만 팀 정책 때문에 ${e.scope}까지만 돼요</div>` : ""}
      ${e.restoreCapped ? `<div class="capNote">⚠️ 개인 복원 권한이 있지만 실제로는 막혀요: ${esc(e.restoreWhy)}</div>` : ""}
      ${m.status !== "ACTIVE" ? `<div class="capNote">계정이 '${STATUS[m.status].label}' 상태라 지금은 로그인해도 이 권한을 쓸 수 없어요</div>` : ""}</div>`;
  }).join("") : `<p style="color:var(--ink3);font-size:13.5px;margin:0">이 팀에 소속된 회원이 없어요. 회원·권한 관리의 권한 탭에서 회원의 소속 팀을 바꿀 수 있어요.</p>`;
  $("sheetBody").innerHTML = `
    <h3 id="sheetTitle">🏢 ${esc(name)} <span class="ev">${id}</span>
      <button class="x" type="button" data-sheet-close aria-label="닫기">×</button></h3>
    ${TEAM_META[id]?.desc ? `<p style="margin:0;color:var(--ink2);font-size:14px">${esc(TEAM_META[id].desc)}</p>` : ""}
    <div><h4 style="margin:0 0 6px;font-size:15px">팀 권한 (최대 범위)</h4>${policyChips(p)}
      <p style="margin:6px 0 0;font-size:13px;color:var(--ink2)">${esc(policyText(p))}</p></div>
    <div><h4 style="margin:4px 0 6px;font-size:15px">역할별로 할 수 있는 일</h4>
      <table class="roleGrid"><thead><tr><th>역할</th><th>문서 검색</th><th>금융 문서</th><th>개인정보 복원</th><th>회원 관리</th></tr></thead><tbody>${roleRows}</tbody></table>
      <p style="margin:6px 0 0;font-size:12px;color:var(--ink3)">역할 기본 권한과 팀 정책 중 좁은 쪽, 신원이 공식 확인된 경우 기준이에요.</p></div>
    <div><h4 style="margin:4px 0 6px;font-size:15px">팀원 ${ms.length}명이 지금 할 수 있는 일</h4>${memberCards}</div>
    <div class="sheetActs"><button type="button" class="ghostBtn" data-sheet-close>닫기</button>
      <button type="button" class="primaryBtn" id="sheetPolicy" style="flex:1">이 팀 권한 설정</button></div>`;
  $("sheetPolicy").onclick = () => editTeamPolicy(id);
  $("sheet").classList.add("open"); $("sheet").setAttribute("aria-hidden", "false");
  $("sheetBody").querySelector(".x").focus();
}

async function linkEmployee(e){
  const s = empStatus(e);
  const options = MEMBERS.filter(m => m.status !== "SUSPENDED" && m.login !== "admin01")
    .sort((a, b) => (a.employee_id ? 1 : 0) - (b.employee_id ? 1 : 0) || a.login.localeCompare(b.login))
    .map(m => `<option value="${m.id}">${esc(m.login)} · ${STATUS[m.status].label}${m.employee_id ? ` (지금 ${m.employee_id}와 연결됨 → 옮김)` : ""}</option>`).join("");
  const r = await ask({title: `${esc(e.id)} 직원과 회원 연결`, yes: "연결",
    text: `회원 계정이 이 직원(${esc(TEAMS[e.team_id] || "팀 미확인")}, ${EMP_STATUS[s]})이라고 연결합니다.<br>
      연결하면 회원은 <b>공식 확인 전까지 '신원 확인 대기'</b>로 바뀌고 개인정보 복원 권한이 꺼져요.`,
    fields: `<label for="lkMember">연결할 회원</label><select id="lkMember" name="member">${options}</select>
      <label for="lkWhy" style="margin-top:8px">사유 (필수)</label><textarea id="lkWhy" name="reason" rows="2" maxlength="200" placeholder="예: 권한신청서 사번과 아이디가 같음"></textarea>`,
    check: v => v.reason ? "" : "사유를 적어 주세요. 활동 기록에 남아요."});
  if (!r) return;
  const m = MEMBERS.find(x => x.id === Number(r.member)), before = m.employee_id;
  Object.assign(m, {employee_id: e.id, team: e.team_id, identity: e.status === "DOC_CONFIRMED" ? "DOC_CONFIRMED" : "UNVERIFIED", restore: false});
  if (m.status === "ACTIVE") m.status = "IDENTITY_PENDING";
  if (m.scope === "TEAM" && !m.team) m.scope = "OWN";
  m.history.push({at: new Date(), text: `직원 연결 ${before ? `${before} → ` : ""}${esc(e.id)} (admin01) · 사유: ${r.reason}`});
  logActivity(`직원 연결 (${before ? before + " → " : ""}${esc(e.id)})`, m.login, "LINK",
    {before: before || "연결 없음", after: e.id, reason: r.reason});
  toast(`${m.login} 회원을 ${esc(e.id)} 직원과 연결했어요 · 신원 확인 대기`);
  drawTeams();
}

async function unlinkEmployee(e){
  const m = linkedMember(e);
  const r = await ask({title: "연결을 해제할까요?", yes: "연결 해제", danger: true, check: needReason,
    text: `<b>${esc(m.login)}</b> 회원과 <b>${esc(e.id)}</b> 직원의 연결을 끊어요. 회원은 '신원 확인 대기'가 되고 개인정보 복원 권한이 꺼져요.`,
    fields: reasonField("예: 잘못 연결함")});
  if (!r) return;
  Object.assign(m, {employee_id: "", identity: "UNVERIFIED", restore: false});
  if (m.status === "ACTIVE") m.status = "IDENTITY_PENDING";
  m.history.push({at: new Date(), text: `직원 연결 해제 ${esc(e.id)} (admin01) · 사유: ${r.reason}`});
  logActivity(`직원 연결 해제 (${esc(e.id)})`, m.login, "UNLINK", {before: e.id, after: "연결 없음", reason: r.reason});
  toast(`${m.login} 회원의 직원 연결을 해제했어요`);
  drawTeams();
}

function bindTeams(){
  if (!EMPLOYEES.length) $("tSource").textContent = "직원 데이터가 없어요. Project_2 폴더에서 python scripts/export_admin_employees.py 를 실행해 주세요.";
  $("tTeam").innerHTML = teamFilterOptions();
  $("tSearch").value = tState.q; $("tTeam").value = tState.team; $("tStatus").value = tState.status;
  $("tSearch").oninput = e => { tState.q = e.target.value; drawTeams(); };
  $("tTeam").onchange = e => { tState.team = e.target.value; drawTeams(); };
  $("tStatus").onchange = e => { tState.status = e.target.value; tState.linked = false; drawTeams(); };
  $("tExport").onclick = exportEmployees;
  $("tNewTeam").onclick = createTeam;
  $("view").onclick = e => {
    const tile = e.target.closest("[data-tile]");

      if (k === "TEAMS") tState.view = "team";
      else { tState.view = "emp"; tState.linked = k === "LINKED"; tState.status = k === "LINKED" ? "" : k; $("tStatus").value = tState.status; }
      return drawTeams();
    }
    const tab = e.target.closest("[data-view]");
    if (tab){ tState.view = tab.dataset.view; return drawTeams(); }
    const ts = e.target.closest("[data-team-sheet]");
    if (ts) return openTeamSheet(ts.dataset.teamSheet);
    const tp = e.target.closest("[data-team-policy]");
    if (tp) return editTeamPolicy(tp.dataset.teamPolicy);
    const go = e.target.closest("[data-team-go]");
    if (go){ Object.assign(tState, {view: "emp", team: go.dataset.teamGo, status: "", linked: false}); $("tTeam").value = tState.team; $("tStatus").value = ""; return drawTeams(); }
    const link = e.target.closest("[data-link]");
    if (link) return linkEmployee(EMPLOYEES.find(x => x.id === link.dataset.link));
    const un = e.target.closest("[data-unlink]");
    if (un) return unlinkEmployee(EMPLOYEES.find(x => x.id === un.dataset.unlink));
    const gm = e.target.closest("[data-goto-member]");
    if (gm){ const m = MEMBERS.find(x => x.id === Number(gm.dataset.gotoMember)); location.hash = "#members"; setTimeout(() => openDetail(m), 0); return; }

}

// ───────── 활동기록 ─────────
// 요청된 네 가지(회원 승인·권한 변경·계정 정지·개인정보 복원)를 앞에 둠
const AUDIT_ORDER = ["APPROVE", "PERMISSION", "SUSPEND", "RESTORE", "REJECT", "RESUME", "IDENTITY", "INVITE", "LINK", "UNLINK", "TEAM_CREATE", "TEAM_POLICY", "DETECT_FIX", "DETECT_VIEW"];
const AUDIT_KEY = new Set(["APPROVE", "PERMISSION", "SUSPEND", "RESTORE"]);
const AUDIT_ICON = {APPROVE: "✅", REJECT: "⛔", INVITE: "✉️", SUSPEND: "🚫", RESUME: "↩️", IDENTITY: "🪪", PERMISSION: "🛡️", LINK: "🔗", UNLINK: "✂️", RESTORE: "🔓", TEAM_CREATE: "🏢", TEAM_POLICY: "🏷️", DETECT_FIX: "🔎", DETECT_VIEW: "👁"};
const auditTone = r => r.type === "RESTORE" ? (r.result === "거부" ? "a-bad" : "a-pii") : r.type === "DETECT_VIEW" ? "a-pii"
  : r.type === "DETECT_FIX" ? "a-perm" : ["SUSPEND", "REJECT", "UNLINK"].includes(r.type) ? "a-bad" : ["PERMISSION", "LINK", "TEAM_CREATE", "TEAM_POLICY"].includes(r.type) ? "a-perm" : "a-good";
const RANGES = [["1", "최근 24시간"], ["7", "최근 7일"], ["30", "최근 30일"], ["90", "최근 90일"], ["all", "전체"]];
const aState = {range: "30", type: "", actor: "", q: "", open: new Set(), limit: 30, tab: "all", result: ""};

function sinceText(d){
  const s = (Date.now() - d) / 1000;
  return s < 60 ? "방금 전" : s < 3600 ? `${Math.floor(s / 60)}분 전` : s < 86400 ? `${Math.floor(s / 3600)}시간 전` : `${Math.floor(s / 86400)}일 전`;
}
function dayLabel(d){
  const a = new Date(d); a.setHours(0, 0, 0, 0);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const n = Math.round((t - a) / 864e5);
  return n === 0 ? "오늘" : n === 1 ? "어제" : `${d.getMonth() + 1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
}
const inRange = () => { const cut = aState.range === "all" ? 0 : Date.now() - Number(aState.range) * 864e5; return sortedAudit().filter(r => r.at >= cut); };
function filteredAudit(){
  const q = aState.q.trim().toLowerCase();
  return inRange().filter(r => (!aState.type || r.type === aState.type) && (!aState.actor || r.actor === aState.actor)
    && (!q || [r.target, r.action, r.actor].some(v => v.toLowerCase().includes(q))));
}
const changeText = r => [r.before && r.after ? `${r.before} → ${r.after}` : r.after || r.before, r.detail,
  r.type === "RESTORE" && r.reason ? `거부 사유: ${r.reason}` : ""].filter(Boolean).join(" · ") || "—";

function drawActivity(){
  const range = inRange();
  $("aStats").innerHTML = [
    [range.length, "전체 기록"], [new Set(range.map(r => r.type)).size, "작업 종류"], [new Set(range.map(r => r.actor)).size, "작업한 사람"],
  ].map(([n, l]) => `<div><b>${num(n)}</b><span>${l}</span></div>`).join("");
  $("aRangeNote").textContent = `· ${RANGES.find(r => r[0] === aState.range)[1]} 기준`;

  const counts = Object.fromEntries(AUDIT_ORDER.map(t => [t, range.filter(r => r.type === t).length]));
  const max = Math.max(1, ...Object.values(counts));
  $("aBreak").innerHTML = AUDIT_ORDER.map(t => `<button type="button" class="bitem${AUDIT_KEY.has(t) ? " key" : ""}" data-btype="${t}" aria-pressed="${aState.type === t}"
      title="${AUDIT_TYPE[t]} ${counts[t]}건 (누르면 이 종류만 보기)">
      <div class="row3"><span>${AUDIT_ICON[t]} ${AUDIT_TYPE[t]}</span><b>${counts[t]}</b></div>
      <div class="trk"><div class="fl" style="width:${counts[t] / max * 100}%"></div></div></button>`).join("");

  $("aRange").innerHTML = RANGES.map(([v, l]) => `<button type="button" data-range="${v}" aria-pressed="${aState.range === v}">${l}</button>`).join("");
  $("aType").innerHTML = `<option value="">모든 종류</option>` + AUDIT_ORDER.map(t => `<option value="${t}">${AUDIT_TYPE[t]}</option>`).join("");
  $("aType").value = aState.type;
  const restoreTab = aState.tab === "restore";
  document.querySelectorAll("[data-atab]").forEach(b => b.setAttribute("aria-selected", b.dataset.atab === aState.tab));
  $("aAllView").hidden = restoreTab; $("aRestoreView").hidden = !restoreTab;
  $("aTypeFld").hidden = restoreTab; $("aResultFld").hidden = !restoreTab;
  $("aActorLbl").textContent = restoreTab ? "요청자" : "작업자";
  const actors = [...new Set(sortedAudit().filter(r => !restoreTab || r.type === "RESTORE").map(r => r.actor))].sort();
  if (aState.actor && !actors.includes(aState.actor)) aState.actor = "";
  $("aActor").innerHTML = `<option value="">모든 사람</option>` + actors.map(a => `<option>${esc(a)}</option>`).join("");
  $("aActor").value = aState.actor;
  $("aResult").value = aState.result;
  if (restoreTab) return drawRestoreHistory();

  const rows = filteredAudit(), shown = rows.slice(0, aState.limit);
  let html = "", last = "";
  shown.forEach(r => {
    const label = dayLabel(r.at);
    if (label !== last){ html += `<tr class="day"><td colspan="6">${label}</td></tr>`; last = label; }
    const open = aState.open.has(r.id);
    html += `<tr>
      <td><button class="chev" type="button" data-open="${esc(r.id)}" aria-expanded="${open}" aria-label="자세히 보기">›</button></td>
      <td class="tm"><b>${fmtDT(r.at).slice(5)}</b><small>${sinceText(r.at)}</small></td>
      <td><span class="actor"><i aria-hidden="true">${esc(r.actor.slice(0, 1).toUpperCase())}</i>${esc(r.actor)}</span></td>
      <td><span class="atag ${auditTone(r)}">${AUDIT_ICON[r.type]} ${esc(r.type === "RESTORE" ? `복원 ${r.result}` : AUDIT_TYPE[r.type])}</span></td>
      <td class="ent"><small>${r.type === "RESTORE" ? "문서" : r.type.startsWith("TEAM_") ? "팀" : "회원"}</small><b>${esc(r.target.replace(/^문서 /, ""))}</b></td>
      <td class="chg">${esc(changeText(r))}</td></tr>`;
    if (open) html += `<tr class="detailRow"><td></td><td colspan="5"><div class="dgrid">
      <div><span>기록 번호</span>#${esc(r.id)}</div><div><span>일시</span>${fmtDT(r.at)}</div><div><span>작업</span>${esc(r.action)}</div>
      <div><span>작업자</span>${esc(r.actor)}</div><div><span>대상</span>${esc(r.target)}</div><div><span>사유</span>${esc(r.reason || "—")}</div>
      <div class="wide"><span>변경 전</span>${esc(r.before || "—")}</div><div class="wide"><span>변경 후</span>${esc(r.after || "—")}</div>${r.detail ? `<div><span>내용</span>${esc(r.detail)}</div>` : ""}
      ${r.purpose ? `<div><span>복원 목적</span>${esc(r.purpose)}</div>` : ""}
    </div></td></tr>`;
  });
  $("aBody").innerHTML = html || `<tr><td colspan="6" class="emptyRow">이 조건에 맞는 기록이 없어요.</td></tr>`;
  $("aMore").hidden = rows.length <= aState.limit;
  $("aMore").textContent = `더 보기 (${rows.length - shown.length}건 남음)`;
}

// ── 개인정보 복원 이력 (누가 언제 무엇을 복원했는지) ──
function restoreRows(){
  const q = aState.q.trim().toLowerCase();
  return inRange().filter(r => r.type === "RESTORE" && (!aState.actor || r.actor === aState.actor)
    && (!aState.result || r.result === aState.result) && (!q || [r.actor, r.target].some(v => v.toLowerCase().includes(q))));
}
const memberOf = login => MEMBERS.find(m => m.login === login);

function drawRestoreHistory(){
  const all = inRange().filter(r => r.type === "RESTORE"), ok = all.filter(r => r.result === "허용");
  const items = ok.reduce((s, r) => s + (r.count || 0), 0);
  $("rTiles").innerHTML = [
    ["복원 요청", all.length, "기간 안의 전체 요청"],
    ["허용", ok.length, `실제 값을 본 항목 ${items}개`],
    ["거부", all.length - ok.length, "복원 권한이 없어 막힘"],
    ["복원한 사람", new Set(ok.map(r => r.actor)).size, "허용된 요청이 있는 사람 수"],
  ].map(([t, n, d]) => `<div class="tile"><div class="t">${t}<span aria-hidden="true">🔓</span></div><div class="n">${n}</div><div class="d">${d}</div></div>`).join("");

  // 사람별 요약
  const people = [...new Set(all.map(r => r.actor))].map(login => {
    const mine = all.filter(r => r.actor === login), yes = mine.filter(r => r.result === "허용");
    return {login, m: memberOf(login), yes: yes.length, no: mine.length - yes.length,
            items: yes.reduce((s, r) => s + (r.count || 0), 0), last: yes[0]?.at};
  }).sort((a, b) => b.yes - a.yes || b.items - a.items || a.login.localeCompare(b.login));
  $("rPeople").innerHTML = people.length ? people.map(p => `<tr${aState.actor === p.login ? ' class="sel"' : ""}>
      <td><button type="button" class="editBtn" data-rperson="${esc(p.login)}" aria-pressed="${aState.actor === p.login}">${esc(p.login)}</button></td>
      <td>${p.m ? `<span class="tag2 r-${p.m.role}">${p.m.role}</span> ${esc(TEAMS[p.m.team] || "팀 미지정")}` : "—"}</td>
      <td>${p.m ? (p.m.restore ? '<span class="rs-yes">허용</span>' : '<span class="rs-no">없음</span>') : "—"}</td>
      <td>${p.yes}</td><td>${p.no ? `<span class="atag a-bad">${p.no}</span>` : 0}</td><td>${p.items}개</td>
      <td>${p.last ? `${fmtDT(p.last)} <small style="color:var(--ink3)">· ${sinceText(p.last)}</small>` : "—"}</td></tr>`).join("")
    : `<tr><td colspan="7" class="emptyRow">이 기간에 복원 요청이 없어요.</td></tr>`;

  // 상세 이력
  const rows = restoreRows();
  $("rBody").innerHTML = rows.length ? rows.map(r => {
    const m = memberOf(r.actor);
    return `<tr>
      <td class="tm"><b>${fmtDT(r.at)}</b><small>${sinceText(r.at)}</small></td>
      <td><span class="actor"><i aria-hidden="true">${esc(r.actor.slice(-2))}</i>${esc(r.actor)}</span>${m ? `<small style="display:block;color:var(--ink3)">${m.role} · ${esc(TEAMS[m.team] || "팀 미지정")}</small>` : ""}</td>
      <td class="ent"><b>${esc(r.target.replace(/^문서 /, ""))}</b></td>
      <td>${esc(kindsText(r.kinds) || "—")}</td>
      <td><span class="atag ${r.result === "허용" ? "a-pii" : "a-bad"}">${r.result === "허용" ? "🔓 허용" : "⛔ 거부"}</span></td>
      <td class="chg">${esc(r.purpose || "—")}${r.reason ? `<br><small style="color:var(--err)">거부 사유: ${esc(r.reason)}</small>` : ""}</td></tr>`;
  }).join("") : `<tr><td colspan="6" class="emptyRow">이 조건에 맞는 복원 기록이 없어요.</td></tr>`;
}

function exportAudit(){   // 복원된 실제 값은 원래 기록하지 않으므로 CSV에도 없음
  if (aState.tab === "restore") return exportRestore();
  const head = ["기록 번호", "일시", "작업자", "종류", "작업", "대상", "변경 전", "변경 후", "사유", "내용"];
  const lines = [head, ...filteredAudit().map(r => [r.id, fmtDT(r.at), r.actor, AUDIT_TYPE[r.type], r.action, r.target, r.before, r.after, r.reason, r.detail])]
    .map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(","));
  downloadCsv(lines, "활동기록");
}
function exportRestore(){
  const head = ["기록 번호", "일시", "요청자", "역할", "팀", "문서", "복원 항목", "항목 수", "결과", "목적", "거부 사유"];
  const lines = [head, ...restoreRows().map(r => { const m = memberOf(r.actor);
    return [r.id, fmtDT(r.at), r.actor, m?.role || "", TEAMS[m?.team] || "", r.target, kindsText(r.kinds), r.count || 0, r.result, r.purpose, r.reason]; })]
    .map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(","));
  downloadCsv(lines, "개인정보복원이력");
}
function downloadCsv(lines, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"}));
  a.download = `${name}_${ymd(new Date()).replace(/\./g, "")}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast(`${name} ${lines.length - 1}건을 CSV로 내보냈어요`);
}

function bindActivity(){
  $("aQ").value = aState.q;
  $("aQ").oninput = e => { aState.q = e.target.value; aState.limit = 30; drawActivity(); };
  $("aType").onchange = e => { aState.type = e.target.value; aState.limit = 30; drawActivity(); };
  $("aActor").onchange = e => { aState.actor = e.target.value; aState.limit = 30; drawActivity(); };
  $("aResult").onchange = e => { aState.result = e.target.value; drawActivity(); };
  $("aMore").onclick = () => { aState.limit += 30; drawActivity(); };
  $("aExport").onclick = exportAudit;
  $("view").onclick = e => {
    const rg = e.target.closest("[data-range]");
    if (rg){ aState.range = rg.dataset.range; aState.limit = 30; return drawActivity(); }
    const tb = e.target.closest("[data-atab]");
    if (tb){ aState.tab = tb.dataset.atab; aState.actor = ""; aState.result = ""; return drawActivity(); }
    const rp = e.target.closest("[data-rperson]");
    if (rp){ aState.actor = aState.actor === rp.dataset.rperson ? "" : rp.dataset.rperson; return drawActivity(); }
    const bt = e.target.closest("[data-btype]");
    if (bt && bt.dataset.btype === "RESTORE"){ aState.tab = "restore"; aState.actor = ""; aState.result = ""; return drawActivity(); }
    if (bt){ aState.tab = "all"; aState.type = aState.type === bt.dataset.btype ? "" : bt.dataset.btype; aState.limit = 30; return drawActivity(); }
    const op = e.target.closest("[data-open]");
    if (op){ const id = Number(op.dataset.open); aState.open.has(id) ? aState.open.delete(id) : aState.open.add(id); drawActivity();
      $("aBody").querySelector(`[data-open="${id}"]`)?.focus(); }
  };
  drawActivity();
}

// ───────── 개인정보 탐지 검토 ─────────
// 챗봇(탐지기)이 잘못·애매하게 본 부분만 보여 주고, 관리자가 바른 범위·종류로 고침.
// 고친 결과는 아직 서버에 저장하지 않음 → [고친 내용 CSV]로 탐지 담당에게 전달 (위치·종류만, 원문 없음)
const DLABEL = {person: "이름", phone_number: "전화번호", email: "이메일", address: "주소",
  resident_registration_number: "주민등록번호", account_number: "계좌번호", card_number: "카드번호"};
const DKIND = {
  BOUNDARY_CUT: ["경계 잘림", "이름·주소·번호가 일부만 잡힘"],
  BOUNDARY_PARTICLE: ["애매한 '이'", "이름 뒤 '이'가 이름인지 조사인지"],
  MISSED_NAME: ["놓친 이름", "이름인데 개인정보로 안 잡힘"],
  MISSED_NUMBER: ["놓친 번호", "번호인데 개인정보로 안 잡힘"],
  LABEL_CONFLICT: ["종류 다름", "다른 종류의 개인정보로 잡힘"],
  NOT_PII: ["개인정보 아님", "개인정보가 아닌데 잡힘"],
};
const DSTATUS = {wait: "대기", fixed: "수정됨", kept: "그대로 둠"};
const dState = {kind: "", status: "wait", q: "", shown: new Set()};
const DFIX = {};   // 항목 id → {status, start, end, label(null 이면 개인정보 아님), how, reason, by, at}
const isMiss = it => it.kind.startsWith("MISSED");
const dStatusOf = it => DFIX[it.id]?.status || "wait";
const original = it => isMiss(it) ? null : {start: it.start, end: it.end, label: it.label};   // 챗봇이 본 결과
function suggested(it){   // 제안대로 고친 결과
  const s = it.suggest;
  if (s.action === "keep") return original(it);   // 챗봇 판단이 맞을 가능성이 높음 (애매한 '이')
  if (s.action === "range") return {start: s.start, end: s.end, label: s.label || it.label};
  if (s.action === "add") return {start: it.start, end: it.end, label: s.label};
  if (s.action === "remove") return null;
  return {start: it.start, end: it.end, label: s.options.find(l => l !== it.label) || it.label};
}
const sameSpan = (a, b) => (!a && !b) || !!(a && b && a.start === b.start && a.end === b.end && a.label === b.label);
const spanDesc = r => r ? `${DLABEL[r.label]} ${r.start}~${r.end} (${r.end - r.start}글자)` : "개인정보 아님";
const SUGGEST_TEXT = {range: "범위를 넓혀요", add: "개인정보로 추가해요", remove: "개인정보에서 빼요", relabel: "종류를 바꿔요", keep: "지금 그대로 둬요"};

// 가리기: 숫자는 •, 의심 부분 안의 글자는 첫 글자만 남기고 ○ (같은 문서의 다른 검토 부분도 가림)
const maskText = s => [...s].map((c, i) => /\d/.test(c) ? "•" : i && /[가-힣A-Za-z]/.test(c) ? "○" : c).join("");
function whyText(it, reveal){
  if (reveal || it.kind === "NOT_PII") return esc(it.why);
  return esc(it.why.replace(/'([^']+)'/g, (m, q) => q.includes(":") || Object.values(DLABEL).includes(q) ? m : `'${maskText(q)}'`)
    .replace(/\(예: ([^)]+)\)/g, (m, q) => `(예: ${maskText(q.slice(0, -1))}${q.slice(-1)})`));   // 판단할 '이'는 보이게
}
function snipHtml(it, r, cls, reveal){
  const others = reveal ? [] : DETECTION_REVIEW.filter(x => x.doc === it.doc)
    .map(x => [Math.min(x.start, x.suggest.start ?? x.start), Math.max(x.end, x.suggest.end ?? x.end)]);
  const keep = it.kind === "BOUNDARY_PARTICLE" ? it.end : -1;   // 애매한 '이'는 판단 대상이라 가리지 않음
  let html = "", inMark = false;
  const mark = on => { if (on !== inMark){ html += on ? `<mark class="${cls}">` : "</mark>"; inMark = on; } };
  for (const [s, e, str, tok] of it.ctx){
    if (tok){ mark(!!r && s >= r.start && e <= r.end); html += `<span class="tok">${esc(str)}</span>`; continue; }
    for (let p = s; p < e; p++){
      const inside = !!r && p >= r.start && p < r.end;
      mark(inside);
      let c = str[p - s];
      if (!reveal && p !== keep){
        const sensitive = inside || others.some(([a, b]) => p >= a && p < b);
        const first = inside ? p === r.start : others.some(([a]) => p === a);
        if (/\d/.test(c)) c = "•";
        else if (sensitive && !first && /[가-힣A-Za-z]/.test(c)) c = /[가-힣]/.test(c) ? "○" : "•";
      }
      html += esc(c);
    }
  }
  mark(false);
  return html;
}
// 한 줄: [이름표] [문장 조각] [종류]
function snipRow(title, it, r, cls, reveal){
  const lbl = r ? `<span class="lbl">${DLABEL[r.label]}</span>` : `<span class="lbl">개인정보 아님</span>`;
  return `<div class="snipRow"><span>${title}</span><div class="snip">${snipHtml(it, r, cls, reveal)} ${lbl}</div></div>`;
}
const origRow = (it, reveal, title = "챗봇이 본 것") => isMiss(it)
  ? snipRow(title, it, {start: it.start, end: it.end}, "miss", reveal).replace(/<span class="lbl">[^<]*<\/span>/, `<span class="lbl">못 잡음</span>`)
  : snipRow(title, it, original(it), "", reveal);
const resultRow = (it, r, title, reveal) => r ? snipRow(title, it, r, "sug", reveal)
  : snipRow(title, it, original(it) || {start: it.start, end: it.end}, "gone", reveal).replace(/<span class="lbl">[^<]*<\/span>/, `<span class="lbl">개인정보 아님</span>`);

function dVisible(){
  const q = dState.q.trim().toLowerCase();
  return DETECTION_REVIEW.filter(it => (!dState.kind || it.kind === dState.kind)
    && (dState.status === "all" || dStatusOf(it) === dState.status)
    && (!q || [it.doc, it.doc_type, it.id].some(v => v.toLowerCase().includes(q))));
}
function drawDetect(){
  const all = DETECTION_REVIEW, cnt = s => all.filter(it => dStatusOf(it) === s).length;
  $("dStats").innerHTML = [[all.length, "검토할 부분"], [cnt("wait"), "대기"], [cnt("fixed"), "수정됨"], [cnt("kept"), "그대로 둠"]]
    .map(([n, l]) => `<div><b>${num(n)}</b><span>${l}</span></div>`).join("");
  const kinds = Object.keys(DKIND).filter(k => all.some(it => it.kind === k));
  $("dTiles").innerHTML = kinds.map(k => {
    const list = all.filter(it => it.kind === k), w = list.filter(it => dStatusOf(it) === "wait").length;
    return `<button type="button" class="tile dtile" data-dkind="${k}" aria-pressed="${dState.kind === k}">
      <div class="t"><span class="ktag k-${k}">${DKIND[k][0]}</span></div><div class="n">${list.length}</div>
      <div class="d">${DKIND[k][1]} · 대기 ${w}건</div></button>`;
  }).join("");
  $("dStatus").innerHTML = [["wait", "대기"], ["fixed", "수정됨"], ["kept", "그대로 둠"], ["all", "전체"]]
    .map(([k, l]) => `<button type="button" data-dstatus="${k}" aria-pressed="${dState.status === k}">${l}</button>`).join("");
  const list = dVisible();
  const waitN = list.filter(it => dStatusOf(it) === "wait").length;
  $("dBulk").disabled = !waitN; $("dBulk").textContent = `보이는 대기 ${waitN}건 제안대로 고치기`;
  $("dNote").textContent = `${dState.kind ? DKIND[dState.kind][0] + " · " : ""}${dState.status === "all" ? "전체" : DSTATUS[dState.status]} ${list.length}건`
    + ` · 원본: ${DETECTION_SOURCE.file.split("/").pop()} (${DETECTION_SOURCE.made} 기준)`;
  $("dList").innerHTML = list.length ? list.map(dCard).join("")
    : `<div class="listPanel emptyRow">${dState.status === "wait" ? "🎉 이 조건에서 검토를 기다리는 항목이 없어요." : "해당하는 항목이 없어요."}</div>`;
}
function dCard(it){
  const st = dStatusOf(it), fix = DFIX[it.id], reveal = dState.shown.has(it.id);
  const rows = [origRow(it, reveal)];
  if (st === "wait") rows.push(resultRow(it, suggested(it), `제안 · ${SUGGEST_TEXT[it.suggest.action]}`, reveal));
  else if (st === "fixed") rows.push(resultRow(it, fix.label ? fix : null, "고친 결과", reveal));
  const meta = fix ? ` · ${esc(fix.by)} ${fmtDT(fix.at)}${fix.reason ? ` · “${esc(fix.reason)}”` : ""}` : "";
  const acts = st === "wait"
    ? `<button type="button" class="primaryBtn" data-dact="suggest" data-id="${it.id}">${it.suggest.action === "keep" ? "제안대로 그대로 두기" : "제안대로 고치기"}</button>
       <button type="button" class="ghostBtn" data-dact="edit" data-id="${it.id}">직접 고치기</button>
       <button type="button" class="ghostBtn" data-dact="keep" data-id="${it.id}">${isMiss(it) ? "개인정보 아님 (그대로)" : "챗봇 판단이 맞음"}</button>`
    : `<button type="button" class="ghostBtn" data-dact="edit" data-id="${it.id}">다시 고치기</button>
       <button type="button" class="ghostBtn" data-dact="undo" data-id="${it.id}">대기로 되돌리기</button>`;
  return `<article class="ditem${st === "wait" ? "" : " done"}" id="d-${it.id}">
    <div class="dhead"><span class="ktag k-${it.kind}">${DKIND[it.kind][0]}</span><b>문서 ${it.doc}</b>· ${esc(it.doc_type)} · ${it.id}
      · <span class="st-${st}">${DSTATUS[st]}</span>${meta}</div>
    <div class="why">${whyText(it, reveal)}</div>
    ${rows.join("")}
    <div class="dacts">${acts}
      <button type="button" class="ghostBtn" data-dact="reveal" data-id="${it.id}" aria-pressed="${reveal}">${reveal ? "🙈 다시 가리기" : "👁 원문 보기"}</button></div>
  </article>`;
}

function saveFix(it, r, how, reason = ""){
  const status = sameSpan(r, original(it)) ? "kept" : "fixed";
  DFIX[it.id] = {status, how, reason, by: "admin01", at: new Date(), ...(r || {label: null})};
  logActivity(status === "kept" ? `탐지 판단 유지 (${DKIND[it.kind][0]})` : `탐지 수정 (${DKIND[it.kind][0]})`, `문서 ${it.doc} · ${it.id}`, "DETECT_FIX",
    {before: isMiss(it) ? "못 잡음" : spanDesc(original(it)), after: spanDesc(r), reason});
  return status;
}
const memoField = `<label for="fMemo">메모 (선택)</label><textarea id="fMemo" name="reason" rows="2" maxlength="200" placeholder="예: '이'까지 이름 (본인 확인)"></textarea>`;

async function dSuggest(it){
  const reveal = dState.shown.has(it.id), r = suggested(it);
  const v = await ask({title: "제안대로 고칠까요?", yes: "고치기",
    text: `문서 <b>${it.doc}</b> · ${it.id} — ${whyText(it, reveal)}`,
    fields: origRow(it, reveal, "지금") + resultRow(it, r, "고친 뒤", reveal) + memoField});
  if (!v) return;
  saveFix(it, r, "제안", v.reason);
  toast(`${it.id} 고쳤어요 · '수정됨'에서 볼 수 있어요`); drawDetect();
}
async function dKeep(it){
  const v = await ask({title: isMiss(it) ? "개인정보가 아니라고 둘까요?" : "챗봇 판단이 맞다고 둘까요?", yes: "그대로 두기",
    text: `문서 <b>${it.doc}</b> · ${it.id} — 바꾸지 않고 검토만 끝내요. 활동기록에 남아요.`, fields: memoField});
  if (!v) return;
  saveFix(it, original(it), "유지", v.reason);
  toast(`${it.id} 그대로 두었어요`); drawDetect();
}
// 직접 고치기: 종류 고르기 + 시작·끝을 한 글자씩 옮기기 (토큰은 통째로만 넘음)
async function dEdit(it){
  const reveal = dState.shown.has(it.id), cur = DFIX[it.id] ? (DFIX[it.id].label ? DFIX[it.id] : null) : (original(it) || suggested(it));
  const stops = [...new Set(it.ctx.flatMap(([s, e, , tok]) => tok ? [s, e] : Array.from({length: e - s + 1}, (_, i) => s + i)))].sort((a, b) => a - b);
  const st = {start: (cur || it).start, end: (cur || it).end, label: cur ? cur.label : "none"};
  const p = ask({title: "탐지 결과 직접 고치기", yes: "저장",
    text: `문서 <b>${it.doc}</b> · ${it.id} — ${whyText(it, reveal)}`,
    fields: origRow(it, reveal, "지금") + `<div id="eAfter"></div>
      <fieldset><legend>종류</legend><div class="kinds" id="eLabel">${[...Object.entries(DLABEL), ["none", "개인정보 아님"]].map(([k, l]) =>
        `<label><input type="radio" name="label" value="${k}"${st.label === k ? " checked" : ""}>${l}</label>`).join("")}</div></fieldset>
      <fieldset><legend>범위 (한 번에 한 글자씩, 다른 개인정보 토큰은 통째로)</legend>
      <div class="adjust" id="eAdj">
        <span>시작</span><div class="btns2"><button type="button" class="ghostBtn" data-adj="start" data-dir="-1">◀ 앞으로</button><button type="button" class="ghostBtn" data-adj="start" data-dir="1">뒤로 ▶</button></div><b id="eS"></b>
        <span>끝</span><div class="btns2"><button type="button" class="ghostBtn" data-adj="end" data-dir="-1">◀ 앞으로</button><button type="button" class="ghostBtn" data-adj="end" data-dir="1">뒤로 ▶</button></div><b id="eE"></b>
      </div></fieldset>
      <input type="hidden" name="start"><input type="hidden" name="end">` + memoField,
    check: v => v.label !== "none" && Number(v.start) >= Number(v.end) ? "범위가 비었어요. 시작을 끝보다 앞에 두세요." : ""});
  const fm = $("dlgFields");
  const paint = () => {
    const r = st.label === "none" ? null : st;
    fm.querySelector("[name=start]").value = st.start; fm.querySelector("[name=end]").value = st.end;
    $("eAfter").innerHTML = resultRow(it, r, "고친 뒤", reveal);
    $("eS").textContent = `${st.start}번째`; $("eE").textContent = `${st.end}번째 (${st.end - st.start}글자)`;
    $("eAdj").querySelectorAll("button").forEach(b => {
      const k = b.dataset.adj, d = Number(b.dataset.dir), i = stops.indexOf(st[k]), next = stops[i + d];
      b.disabled = st.label === "none" || next === undefined || (k === "start" ? next >= st.end : next <= st.start);
    });
  };
  $("eAdj").onclick = e => {
    const b = e.target.closest("[data-adj]"); if (!b || b.disabled) return;
    const k = b.dataset.adj; st[k] = stops[stops.indexOf(st[k]) + Number(b.dataset.dir)]; paint();
  };
  $("eLabel").onchange = e => { st.label = e.target.value; paint(); };
  paint();
  const v = await p;
  if (!v) return;
  const r = v.label === "none" ? null : {start: Number(v.start), end: Number(v.end), label: v.label};
  const status = saveFix(it, r, "직접", v.reason);
  toast(status === "kept" ? `${it.id} 챗봇 판단과 같아서 '그대로 둠'으로 했어요` : `${it.id} 고쳤어요`); drawDetect();
}
async function dBulk(){
  const list = dVisible().filter(it => dStatusOf(it) === "wait");
  if (!list.length) return;
  const by = Object.entries(list.reduce((a, it) => (a[it.kind] = (a[it.kind] || 0) + 1, a), {}))
    .map(([k, n]) => `<li>${DKIND[k][0]} ${n}건 — ${SUGGEST_TEXT[DETECTION_REVIEW.find(x => x.kind === k).suggest.action]}</li>`).join("");
  const warn = list.some(it => it.kind === "BOUNDARY_PARTICLE")
    ? `<p style="color:var(--wait);font-size:13.5px">⚠ '애매한 이' 항목은 이름인지 조사인지 사람이 판단해야 해서, 하나씩 보는 것을 권해요.</p>` : "";
  const v = await ask({title: `${list.length}건을 제안대로 고칠까요?`, yes: `${list.length}건 고치기`,
    text: "지금 화면에 보이는 대기 항목만 고쳐요. 하나하나 활동기록에 남고, 나중에 항목별로 되돌릴 수 있어요.",
    fields: `<ul>${by}</ul>${warn}` + memoField});
  if (!v) return;
  list.forEach(it => saveFix(it, suggested(it), "일괄 제안", v.reason));
  toast(`${list.length}건 고쳤어요`); drawDetect();
}
function exportFixes(){
  const done = DETECTION_REVIEW.filter(it => DFIX[it.id]);
  if (!done.length) return toast("아직 고친 항목이 없어요");
  const head = ["항목", "문서", "문제 종류", "챗봇 시작", "챗봇 끝", "챗봇 종류", "결정", "고친 시작", "고친 끝", "고친 종류", "방법", "메모", "처리자", "처리 시각"];
  const lines = [head.join(","), ...done.map(it => { const f = DFIX[it.id], o = original(it);
    return [it.id, it.doc, DKIND[it.kind][0], o?.start ?? "", o?.end ?? "", o ? o.label : "(못 잡음)", DSTATUS[f.status],
      f.label ? f.start : "", f.label ? f.end : "", f.label || "(개인정보 아님)", f.how, f.reason, f.by, fmtDT(f.at)]; })
    .map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(","))];   // 원문 글자는 넣지 않음 (위치·종류만)
  downloadCsv(lines, "탐지수정");
}
function bindDetect(){
  $("dQ").oninput = e => { dState.q = e.target.value; drawDetect(); };
  $("dBulk").onclick = dBulk;
  $("dExport").onclick = exportFixes;
  $("view").onclick = e => {
    const k = e.target.closest("[data-dkind]");
    if (k){ dState.kind = dState.kind === k.dataset.dkind ? "" : k.dataset.dkind; return drawDetect(); }
    const s = e.target.closest("[data-dstatus]");
    if (s){ dState.status = s.dataset.dstatus; return drawDetect(); }
    const b = e.target.closest("[data-dact]");
    if (!b) return;
    const it = DETECTION_REVIEW.find(x => x.id === b.dataset.id);
    const a = b.dataset.dact;
    if (a === "reveal"){
      if (dState.shown.has(it.id)) dState.shown.delete(it.id);
      else { dState.shown.add(it.id); logActivity("탐지 원문 보기", `문서 ${it.doc} · ${it.id}`, "DETECT_VIEW", {detail: "검토를 위해 해당 부분 원문 열람"}); }
      drawDetect(); return $("d-" + it.id)?.querySelector("[data-dact=reveal]")?.focus();
    }
    if (a === "suggest") return dSuggest(it);
    if (a === "keep") return dKeep(it);
    if (a === "edit") return dEdit(it);
    if (a === "undo"){
      const f = DFIX[it.id]; delete DFIX[it.id];
      logActivity("탐지 수정 되돌림", `문서 ${it.doc} · ${it.id}`, "DETECT_FIX", {before: f.label ? spanDesc(f) : "개인정보 아님", after: "대기"});
      toast(`${it.id} 대기로 되돌렸어요`); drawDetect();
    }
  };
  drawDetect();
}

    icon: `<rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9.5 16h5"/>`},
  {key: "storage", name: "데이터 저장소", desc: "문서 및 백업 저장 상태", ok: "정상", impact: "문서 손실 및 복구 문제",
    icon: `<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>`},
];
const SYS_STATE = {ok: "", warn: "주의", down: "장애", unknown: "확인 안 됨", wait: "점검 중…"};
const SYS_MARK = {ok: "●", warn: "▲", down: "✕", unknown: "?", wait: "…"};
const sys = {mode: "live", run: 0, result: null};

async function sysFetch(url){   // 5초 안에 답이 없으면 실패로 봄
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 5000), t0 = performance.now();
  try {
    const r = await fetch(url, {credentials: "same-origin", cache: "no-store", signal: ctl.signal});
    return {r, ms: Math.round(performance.now() - t0)};
  } finally { clearTimeout(timer); }
}
async function sysCheck(){
  const run = ++sys.run, res = {at: new Date(), items: {}, ops: {}, cfg: null, healthApi: false, src: {}};
  SYS_ITEMS.forEach(i => res.items[i.key] = {status: "wait"});
  sys.result = res; drawSystem();
  // 1) API 서버: 직접 물어봄
  try {
    const {r, ms} = await sysFetch("/api/info");
    if (r.status === 401) return location.replace("/login?next=/admin");
    res.items.api = r.ok ? {status: "ok", detail: `응답 ${ms}ms (이 화면에서 잰 값)`} : {status: "down", detail: `서버 오류 (HTTP ${r.status})`};
    if (r.ok) res.cfg = await r.json().catch(() => null);
  } catch (e) {
    res.items.api = {status: "down", detail: e.name === "AbortError" ? "5초 안에 응답 없음" : "서버에 연결할 수 없음 (uvicorn 이 켜져 있는지 확인)"};
  }
  res.src.api = "live";
  // 2) 나머지: 서버 점검 API 가 있으면 그 값
  let health = null;
  if (res.items.api.status !== "down"){
    try { const {r} = await sysFetch("/api/admin/health"); if (r.ok) health = await r.json(); } catch (e) { /* 없음 */ }
  }
  res.healthApi = !!health;
  SYS_ITEMS.filter(i => i.key !== "api").forEach(i => {
    const h = health?.items?.[i.key];
    res.items[i.key] = h && SYS_STATE[h.status] !== undefined && h.status !== "wait" && h.status !== "unknown"
      ? {status: h.status, detail: h.detail || ""}
      : {status: "unknown", detail: res.items.api.status === "down" ? "API 서버가 응답하지 않아 확인할 수 없어요"
        : health ? "서버 점검 결과에 이 항목이 없어요" : "서버 점검 API가 아직 없어요 (백엔드 연결 전)"};
    res.src[i.key] = h ? "server" : "none";
  });
  if (health?.checked_at) res.at = new Date(health.checked_at);
  res.ops = {errors: health?.ops?.errors_24h, backup: health?.ops?.last_backup ? new Date(health.ops.last_backup) : null};
  if (run !== sys.run) return;   // 그 사이 다시 점검을 눌렀으면 버림
  sys.result = res; drawSystem();
}
function demoResult(){   // 예시 화면: 디자인 미리보기용. 숫자는 넣지 않음
  const items = {}, src = {};
  SYS_ITEMS.forEach(i => { items[i.key] = {status: "ok", detail: "예시 값"}; src[i.key] = "demo"; });
  return {at: null, items, src, ops: {}, cfg: null, demo: true};
}
function drawSystem(){
  if (!$("sGrid")) return;   // 다른 화면으로 옮겨 감
  const res = sys.mode === "demo" ? demoResult() : sys.result;
  const st = SYS_ITEMS.map(i => res.items[i.key].status), n = s => st.filter(x => x === s).length;
  $("sStats").innerHTML = [[n("ok"), "정상"], [n("warn") + n("down"), "확인 필요"], [n("unknown") + n("wait"), "확인 안 됨"]]
    .map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
  document.querySelectorAll("[data-smode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.smode === sys.mode));
  $("sRecheck").disabled = sys.mode === "demo" || st.includes("wait");
  $("sNote").innerHTML = res.demo
    ? `<span class="mock">예시 화면</span> 실제 서버 상태가 아니에요. 모든 항목이 정상일 때 어떻게 보이는지 보여 주는 화면이에요.`
    : st.includes("wait") ? "점검하는 중이에요…"
    : `${fmtDT(res.at)} 점검 · API 서버는 이 화면이 직접 확인했어요. ${res.healthApi ? "나머지는 서버 점검 API 결과예요." : "나머지 5개는 서버 점검 API(/api/admin/health)가 생기면 표시돼요."}`;
  const srcText = {live: "이 화면에서 직접 확인", server: "서버 점검 결과", none: "아직 확인 방법 없음", demo: "예시"};
  $("sGrid").innerHTML = SYS_ITEMS.map(i => {
    const it = res.items[i.key], label = it.status === "ok" ? i.ok : SYS_STATE[it.status];
    return `<article class="hcard${i.key2 ? " key" : ""}" data-sys="${i.key}">
      <div class="htop"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${i.icon}</svg></span>
        <div><b>${i.name}</b>${i.key2 ? ` <span class="keytag">핵심</span>` : ""}<div class="hsrc">${srcText[res.src?.[i.key]] || ""}</div></div>
        <span class="hbadge h-${it.status}"><span aria-hidden="true">${SYS_MARK[it.status]}</span> ${label}</span></div>
      <div class="desc">${i.desc}</div>
      ${it.detail ? `<div class="detail">${esc(it.detail)}</div>` : ""}
      <div class="impact">문제가 생기면: <b>${i.impact}</b>${i.key2 ? " — 이 시스템의 핵심이라 따로 표시해요" : ""}</div>
    </article>`;
  }).join("");
  const none = `<span style="color:var(--ink3)">—</span>`;
  const opsN = v => res.demo ? `<span class="mock">예시</span>` : v;
  $("sOps").innerHTML = [
    ["마지막 점검 시간", opsN(res.at && !st.includes("wait") ? fmtDT(res.at) : none), res.healthApi ? "서버 점검 시각" : "이 화면에서 점검한 시각"],
    ["최근 오류 건수", opsN(res.ops.errors != null ? `${num(res.ops.errors)}건` : none), res.ops.errors != null ? "최근 24시간" : "서버 측정값 없음"],
    ["최근 백업 시간", opsN(res.ops.backup ? fmtDT(res.ops.backup) : none), res.ops.backup ? "서버 기록" : "서버 측정값 없음"],
  ].map(([t, v, d]) => `<div class="tile"><div class="t">${t}</div><div class="n">${v}</div><div class="d">${d}</div></div>`).join("");
  const c = res.cfg;
  $("sConfig").hidden = !c;
  if (c) $("sCfg").innerHTML = [["검색 방식", c.search_mode], ["임베딩 모델", c.embed_model], ["AI 모델 (LLM)", c.llm_model]]
    .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
}
function bindSystem(){
  $("sRecheck").onclick = sysCheck;
  $("view").onclick = e => {
    const m = e.target.closest("[data-smode]");
    if (m){ sys.mode = m.dataset.smode; drawSystem(); }
  };
  sys.mode = "live";
  sysCheck();
}

// ───────── 메뉴 ─────────
const PAGES = {members: "회원·권한 관리", teams: "팀 관리", documents: "문서 관리", detect: "탐지 검토", persons: "인물 검토", activity: "활동기록", settings: "시스템 환경"};
const ALIAS = {roles: ["members", "perm"]};   // 예전 권한관리 주소(#roles)는 합친 페이지의 권한 탭으로

// 회원·권한 관리: 회원 목록 / 권한 탭 바꾸기 (주소도 #members / #roles 로 맞춤, 다시 그리지 않고)
function setMemberView(v, updateHash = true){
  $("mListView").hidden = v !== "list"; $("mPermView").hidden = v !== "perm";
  document.querySelectorAll("[data-mview]").forEach(b => b.setAttribute("aria-selected", b.dataset.mview === v));
  if (v === "list") drawMembers(); else drawRoles();
  if (updateHash) history.replaceState(null, "", v === "perm" ? "#roles" : "#members");
  document.title = `${v === "perm" ? "권한" : "회원 목록"} · 회원·권한 관리`;
}

function route(){
  let name = (location.hash || "#dashboard").slice(1), view = "list";
  if (ALIAS[name]) [name, view] = ALIAS[name];
  const page = PAGES[name] ? name : "dashboard";
  $("view").onclick = $("view").onkeydown = null;   // 앞 화면의 클릭 처리 지우기
  document.querySelectorAll("#menu a").forEach(a => {
    if (a.getAttribute("href") === "#" + page) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (page === "dashboard"){
    $("view").replaceChildren($("dashboardTpl").content.cloneNode(true));
    drawKpis($("range").value); drawDonut(); drawTables(); drawSecurity();
    $("range").onchange = e => drawKpis(e.target.value);
    document.title = "관리자 대시보드";
  } else if (page === "members"){
    $("view").replaceChildren($("membersTpl").content.cloneNode(true));
    bindMembers(); bindRoles();
    $("view").onclick = e => {
      const tab = e.target.closest("[data-mview]");
      if (tab) return setMemberView(tab.dataset.mview);
      const open = e.target.closest("[data-member-open]");   // 권한 표의 회원 이름 → 회원 상세
      if (open) return openDetail(MEMBERS.find(m => m.id === Number(open.dataset.memberOpen)));
    };
    setMemberView(view, false);
  } else if (page === "teams"){
    $("view").replaceChildren($("teamsTpl").content.cloneNode(true));
    bindTeams();
    document.title = "팀 관리 · 관리자센터";
  } else if (page === "documents" && typeof drawDocumentsPage === "function"){
    drawDocumentsPage();   // 문서 담당자·팀 확정 화면 (business_admin.js)
    document.title = "문서 관리 · 관리자센터";
  } else if (page === "settings"){
    $("view").replaceChildren($("systemTpl").content.cloneNode(true));
    bindSystem();
    document.title = "시스템 환경 · 관리자센터";
  } else if (page === "detect"){
    $("view").replaceChildren($("detectTpl").content.cloneNode(true));
    bindDetect();
    document.title = "탐지 검토 · 관리자센터";
  } else if (page === "persons"){
    $("view").replaceChildren($("personsTpl").content.cloneNode(true));
    bindPersons();
    document.title = "인물 검토 · 관리자센터";
  } else if (page === "activity"){
    $("view").replaceChildren($("activityTpl").content.cloneNode(true));
    bindActivity();
    document.title = "활동기록 · 관리자센터";
  } else {
    $("view").innerHTML = `<div class="soon"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#8A93A5" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>
      <h2>${PAGES[page]}</h2><p>아직 준비 중인 메뉴예요. 회원·권한 데이터가 연결되면 이곳에서 관리할 수 있어요.</p>
      <p><a href="#dashboard">대시보드로 돌아가기</a></p></div>`;
    document.title = `${PAGES[page]} · 관리자센터`;
  }
  window.scrollTo(0, 0);
}
// 실제 DB를 불러온 후 연결 스크립트에서 화면을 시작합니다.

// ───────── 위쪽 사용자 메뉴·로그아웃 ─────────
$("meBtn").onclick = e => {
  e.stopPropagation();
  const open = $("drop").classList.toggle("open");
  $("meBtn").setAttribute("aria-expanded", open);
};
document.addEventListener("click", () => { $("drop").classList.remove("open"); $("meBtn").setAttribute("aria-expanded", "false"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("drop").classList.remove("open"); });
document.querySelectorAll("[data-logout]").forEach(b => b.onclick = async () => {
  try { await fetch("/api/logout", {method: "POST"}); } finally { location.replace("/login"); }
});
</script>
