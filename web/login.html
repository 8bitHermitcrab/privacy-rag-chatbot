<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · 어흥이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#8A3F0E}a:hover{color:#4A2E14}
</style>
</head>
<body>
<div style="min-height: 900px; box-sizing: border-box; padding: 48px 24px; background: #FFF6E6; color: #4A2E14; font-family: 'Gowun Dodum', sans-serif; display: flex; align-items: center; justify-content: center">
<div style="width: 100%; max-width: 960px; display: flex; flex-wrap: wrap; background: #FFFDF8; border: 1px solid #EED9B5; border-radius: 24px; overflow: hidden">
<div style="flex: 1 1 360px; background: #FDE7BF; padding: 48px 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center">
<svg width="180" height="180" viewBox="0 0 200 200" role="img" aria-label="아기 사자 어흥이"><circle cx="100" cy="100" r="92" fill="#E8892B"/><circle cx="100" cy="100" r="74" fill="#D9771F"/><circle cx="52" cy="50" r="18" fill="#F7C46C"/><circle cx="52" cy="50" r="9" fill="#F2A35E"/><circle cx="148" cy="50" r="18" fill="#F7C46C"/><circle cx="148" cy="50" r="9" fill="#F2A35E"/><circle cx="100" cy="106" r="58" fill="#F7C46C"/><ellipse cx="100" cy="130" rx="26" ry="19" fill="#FFF1D6"/><ellipse cx="78" cy="100" rx="7" ry="9" fill="#4A2E14"/><ellipse cx="122" cy="100" rx="7" ry="9" fill="#4A2E14"/><ellipse cx="64" cy="118" rx="9" ry="5" fill="#F29C8B" opacity=".7"/><ellipse cx="136" cy="118" rx="9" ry="5" fill="#F29C8B" opacity=".7"/><path d="M92 122 Q100 117 108 122 Q100 131 92 122Z" fill="#7A3E1A"/></svg>
<h1 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 36px">아기 사자 어흥이</h1>
<p style="margin: 0; font-size: 18px; color: #7A5634; line-height: 1.6">개인정보는 이름표로 숨기고<br>내가 볼 수 있는 기록만 찾아줘요</p>
</div>
<div id="already" hidden style="flex: 1 1 360px; padding: 56px 48px; flex-direction: column; gap: 20px; box-sizing: border-box; justify-content: center">
<h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 28px">이미 로그인돼 있어요</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6">현재 계정: <b id="current-id"></b></p>
<button id="go-chat" type="button" style="font-family: 'Jua', sans-serif; font-size: 20px; padding: 14px; border: none; border-radius: 999px; background: #A84A12; color: #FFFFFF; box-shadow: 0 3px 0 #7A3E1A; cursor: pointer">이대로 계속하기</button>
<button id="switch" type="button" style="font-family: 'Jua', sans-serif; font-size: 18px; padding: 12px; border: 1px solid #CDB894; border-radius: 999px; background: #FFFFFF; color: #4A2E14; cursor: pointer">다른 계정으로 로그인</button>
<p class="msg" role="status" style="margin: 0; min-height: 22px; font-size: 15px; color: #B43B3B; white-space: pre-wrap"></p>
</div>
<form id="login" novalidate style="flex: 1 1 360px; padding: 56px 48px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
<h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 28px">로그인</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="login-id" style="font-size: 16px">아이디</label>
<input id="login-id" type="text" placeholder="아이디" autocomplete="username" required maxlength="100" style="font: inherit; font-size: 17px; padding: 14px 16px; border: 1px solid #CDB894; border-radius: 12px; background: #FFFFFF; color: #4A2E14">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="login-pw" style="font-size: 16px">비밀번호</label>
<input id="login-pw" type="password" placeholder="비밀번호" autocomplete="current-password" required maxlength="256" style="font: inherit; font-size: 17px; padding: 14px 16px; border: 1px solid #CDB894; border-radius: 12px; background: #FFFFFF; color: #4A2E14">
</div>
<button id="login-btn" type="submit" style="font-family: 'Jua', sans-serif; font-size: 20px; padding: 14px; border: none; border-radius: 999px; background: #A84A12; color: #FFFFFF; box-shadow: 0 3px 0 #7A3E1A; cursor: pointer">어흥! 들어가기</button>
<div style="background: #FFF1D6; border: 1px solid #EED9B5; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 15px; font-weight: 700">처음 로그인하나요?</p>
<p style="margin: 0; font-size: 15px; color: #7A5634; line-height: 1.6">관리자가 준 임시 비밀번호로 들어온 뒤, 새 비밀번호로 바꿔야 쓸 수 있어요.</p>
</div>
<p style="margin: 0; font-size: 14px; color: #7A5634">5번 틀리면 15분 동안 로그인할 수 없어요</p>
<p class="msg" role="status" style="margin: 0; min-height: 22px; font-size: 15px; color: #B43B3B; white-space: pre-wrap"></p>
</form>
<form id="change" hidden novalidate style="flex: 1 1 360px; padding: 56px 48px; flex-direction: column; gap: 20px; box-sizing: border-box">
<h2 style="margin: 0; font-family: 'Jua', sans-serif; font-weight: 400; font-size: 28px">새 비밀번호 만들기</h2>
<p style="margin: 0; font-size: 15px; color: #7A5634; line-height: 1.6">임시 비밀번호로 들어왔어요. 새 비밀번호로 바꾸면 시작 화면으로 이동해요.</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="old-pw" style="font-size: 16px">현재(임시) 비밀번호</label>
<input id="old-pw" type="password" autocomplete="current-password" required maxlength="256" style="font: inherit; font-size: 17px; padding: 14px 16px; border: 1px solid #CDB894; border-radius: 12px; background: #FFFFFF; color: #4A2E14">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="new-pw" style="font-size: 16px">새 비밀번호 (14자 이상)</label>
<input id="new-pw" type="password" autocomplete="new-password" required minlength="14" maxlength="256" style="font: inherit; font-size: 17px; padding: 14px 16px; border: 1px solid #CDB894; border-radius: 12px; background: #FFFFFF; color: #4A2E14">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="new-pw2" style="font-size: 16px">새 비밀번호 확인</label>
<input id="new-pw2" type="password" autocomplete="new-password" required minlength="14" maxlength="256" style="font: inherit; font-size: 17px; padding: 14px 16px; border: 1px solid #CDB894; border-radius: 12px; background: #FFFFFF; color: #4A2E14">
</div>
<button id="change-btn" type="submit" style="font-family: 'Jua', sans-serif; font-size: 20px; padding: 14px; border: none; border-radius: 999px; background: #A84A12; color: #FFFFFF; box-shadow: 0 3px 0 #7A3E1A; cursor: pointer">바꾸고 들어가기</button>
<p class="msg" role="status" style="margin: 0; min-height: 22px; font-size: 15px; color: #B43B3B; white-space: pre-wrap"></p>
</form>
</div>
</div>
<script>
// 로그인: /api/login → (임시 비밀번호면) /api/password → /start (챗봇·관리자 선택)
const $ = id => document.getElementById(id);
const loginForm = $('login'), changeForm = $('change');
let csrf = '';
function say(form, text){ form.querySelector('.msg').textContent = text || ''; }
async function send(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json', 'X-CSRF-Token':csrf}, body:JSON.stringify(body)});
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw Error(typeof d.detail === 'string' ? d.detail : '입력값을 확인해 주세요.');
  return d;
}
function showChange(){ loginForm.style.display = 'none'; changeForm.hidden = false; changeForm.style.display = 'flex'; $('old-pw').focus(); }
const already = $('already');
function showLogin(){ already.hidden = true; already.style.display = 'none'; changeForm.hidden = true; changeForm.style.display = 'none';
  loginForm.style.display = 'flex'; $('login-id').focus(); }
function showAlready(loginId){ loginForm.style.display = 'none'; already.hidden = false; already.style.display = 'flex';
  $('current-id').textContent = loginId; }
// 첫 화면: 로그인돼 있으면 계정 선택지, 임시 비밀번호 상태면 변경 화면, 아니면 로그인 폼
async function check(){
  const r = await fetch('/api/me', {cache:'no-store'});
  if (!r.ok) return null;
  const d = await r.json(); csrf = d.csrf; return d;
}
async function start(){
  const d = await check();
  if (!d) return;
  if (d.must_change_password) showChange(); else showAlready(d.login_id);
}
// 로그인 직후: 임시 비밀번호면 변경 화면, 아니면 시작 화면으로
async function ready(){
  const d = await check();
  if (!d) return false;
  if (d.must_change_password) { showChange(); return true; }
  location.replace('/start'); return true;
}
$('go-chat').addEventListener('click', () => location.replace('/start'));
$('switch').addEventListener('click', async () => {
  $('switch').disabled = true; say(already, '');
  try { await send('/api/logout', {}); csrf = ''; showLogin(); }
  catch (err) { say(already, err.message); }
  finally { $('switch').disabled = false; }
});
loginForm.addEventListener('submit', async e => {
  e.preventDefault(); say(loginForm, '');
  const id = $('login-id').value.trim(), pw = $('login-pw').value;
  if (!id || !pw) { say(loginForm, '아이디와 비밀번호를 입력해 주세요.'); return; }
  $('login-btn').disabled = true;
  try {
    await send('/api/login', {login_id:id, password:pw});
    $('login-pw').value = '';
    if (!await ready()) say(loginForm, '로그인 상태를 확인하지 못했어요. 다시 시도해 주세요.');
  } catch (err) { say(loginForm, err.message); }
  finally { $('login-btn').disabled = false; }
});
changeForm.addEventListener('submit', async e => {
  e.preventDefault(); say(changeForm, '');
  const oldPw = $('old-pw').value, newPw = $('new-pw').value;
  if (newPw.length < 14) { say(changeForm, '새 비밀번호는 14자 이상이어야 해요.'); return; }
  if (newPw !== $('new-pw2').value) { say(changeForm, '새 비밀번호 두 칸이 서로 달라요.'); return; }
  $('change-btn').disabled = true;
  try {
    await send('/api/password', {old_password:oldPw, new_password:newPw});
    $('old-pw').value = $('new-pw').value = $('new-pw2').value = '';
    location.replace('/start');
  } catch (err) { say(changeForm, err.message); }
  finally { $('change-btn').disabled = false; }
});
start();
</script>
</body>
</html>
