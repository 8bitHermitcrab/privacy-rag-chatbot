<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어흥이 챗봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6E6; --card:#FFFDF8; --ink:#4A2E14; --ink2:#7A5634; --line:#EED9B5;
    --mane:#E8892B; --mane2:#C9671A; --accent:#E26D2C; --user:#5B8C5A;
    --chip:#FFE3B8; --chip-ink:#8A3F0E; --stage:#FDE7BF;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
       font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
  .app{height:100%;display:grid;grid-template-columns:minmax(320px,400px) 1fr}

  /* ── 왼쪽: 어흥이 무대 ── */
  .stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 24px;
         background:radial-gradient(circle at 50% 78%,#FFD58F 0,var(--stage) 38%,#F9D9A4 100%);border-right:3px dashed var(--line);overflow:hidden}
  .stage h1{position:absolute;top:22px;left:0;right:0;text-align:center;margin:0;font-family:'Jua',sans-serif;font-weight:400;font-size:26px;line-height:1.2}
  .stage h1 small{display:block;font-family:inherit;font-size:14px;color:var(--ink2);margin-top:4px}
  .speech{position:relative;width:100%;max-width:320px;min-height:96px;background:var(--card);border:3px solid var(--ink);border-radius:24px;
          padding:14px 18px;font-size:18px;line-height:1.55;box-shadow:0 5px 0 rgba(74,46,20,.18)}
  .speech::after{content:"";position:absolute;left:50%;bottom:-16px;transform:translateX(-50%) rotate(45deg);width:24px;height:24px;
                 background:var(--card);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink)}
  .speech .caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:-3px;margin-left:2px;animation:caret 1s steps(1) infinite}
  .lionWrap{width:min(300px,80%);aspect-ratio:1/1.05;position:relative}
  .lionWrap svg{width:100%;height:100%;overflow:visible}
  .ground{width:220px;height:22px;border-radius:50%;background:rgba(122,74,30,.18);margin-top:-30px}
  .bubbles{position:absolute;right:6%;top:20%;font-size:30px;opacity:0;transition:opacity .2s}

  /* 어흥이 애니메이션 */
  #head{transform-box:fill-box;transform-origin:50% 90%;animation:sway 4s ease-in-out infinite}
  #body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
  #tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.6s ease-in-out infinite}
  #mouthOpen{transform-box:fill-box;transform-origin:50% 0%;transform:scaleY(0);opacity:0}
  #frown{opacity:0}
  .stage.talking #mouthOpen{opacity:1;animation:talk .22s ease-in-out infinite alternate}
  .stage.talking #smile{opacity:0}
  .stage.thinking #head{animation:think 1.4s ease-in-out infinite}
  .stage.thinking .bubbles{opacity:1;animation:float 1.2s ease-in-out infinite}
  .stage.sad #smile{opacity:0}
  .stage.sad #frown{opacity:1}
  .stage.sad #head{animation:none;transform:rotate(-6deg) translateY(4px)}
  .stage.sad #tail{animation:none}
  .stage.happy .lionWrap{animation:hopBig .5s ease-out 2}

  /* ── 오른쪽: 채팅 ── */
  .chat{display:flex;flex-direction:column;min-width:0;height:100%;padding:0 24px}
  .top{display:flex;align-items:center;gap:10px;padding:16px 0 12px;border-bottom:2px dashed var(--line);color:var(--ink2);font-size:14px}
  .top b{font-family:'Jua',sans-serif;font-weight:400;font-size:20px;color:var(--ink)}
  .top label{margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap}
  select{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:3px 8px}
  #log{flex:1;overflow-y:auto;padding:18px 0 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .bubble{max-width:min(680px,86%);padding:12px 16px;border-radius:18px}
  .bot .bubble{background:var(--card);border:2px solid var(--line);border-top-left-radius:6px;box-shadow:0 3px 0 var(--line)}
  .me .bubble{background:var(--user);color:#fff;border-top-right-radius:6px}
  .who{display:block;font-family:'Jua',sans-serif;color:var(--accent);font-size:15px;margin-bottom:2px}
  .tok{display:inline-block;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:0 8px;margin:1px 0;
       font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82em;line-height:1.7;white-space:nowrap}
  .tail{display:block;margin-top:8px;color:var(--ink2);font-size:13px}
  details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  summary{cursor:pointer;color:var(--ink2);font-size:14px;list-style:none}
  summary::before{content:"🐾 "}
  summary::-webkit-details-marker{display:none}
  .meta{font-size:14px;margin:8px 0;color:var(--ink2)}
  .doc{background:#FFF8EC;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
  .doc .key{color:var(--accent);font-weight:700}
  .doc pre{margin:6px 0 0;white-space:pre-wrap;font-family:inherit;color:var(--ink2);max-height:150px;overflow:auto}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px}
  .chips button{font:inherit;font-size:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
  .chips button:hover{border-color:var(--mane);background:#FFF1DB}
  form{display:flex;gap:10px;padding:4px 0 14px}
  #q{flex:1;min-width:0;font:inherit;padding:12px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
  #q:focus{border-color:var(--mane)}
  #send{font-family:'Jua',sans-serif;font-size:18px;border:none;border-radius:999px;padding:0 22px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--mane2)}
  #send:disabled{opacity:.55;cursor:default}
  .note{font-size:12px;color:var(--ink2);text-align:center;padding-bottom:10px}

  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
  @keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  @keyframes think{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes hopBig{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}}
  @keyframes caret{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  /* 좁은 화면: 어흥이를 위로 작게 */
  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .stage{flex-direction:row;padding:12px 16px;gap:12px;border-right:none;border-bottom:3px dashed var(--line);justify-content:flex-start}
    .stage h1,.ground{display:none}
    .lionWrap{width:96px;flex:none;order:-1}
    .speech{font-size:15px;min-height:0;padding:10px 12px;max-width:none;flex:1}
    .speech::after{left:-15px;top:50%;bottom:auto;transform:translateY(-50%) rotate(135deg)}
    .chat{padding:0 16px;min-height:0}
    .top{display:none}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="stage" id="stage">
    <h1>아기 사자 어흥이<small>개인정보는 이름표로 숨기고 기록을 찾아줘요</small></h1>
    <div class="speech" id="speech" aria-live="polite"></div>
    <div class="lionWrap">
      <span class="bubbles">🔍</span>
      <svg viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="아기 사자 어흥이">
        <!-- 꼬리 -->
        <g id="tail"><path d="M140 182 Q178 176 176 140" stroke="#D9771F" stroke-width="8" fill="none" stroke-linecap="round"/>
          <circle cx="176" cy="136" r="10" fill="#C9671A"/></g>
        <!-- 몸 -->
        <g id="body">
          <ellipse cx="100" cy="168" rx="50" ry="38" fill="#F2B457"/>
          <ellipse cx="100" cy="176" rx="28" ry="24" fill="#FFF1D6"/>
          <ellipse cx="68" cy="198" rx="17" ry="11" fill="#F7C46C"/><ellipse cx="132" cy="198" rx="17" ry="11" fill="#F7C46C"/>
          <path d="M62 198 v5 M68 198 v6 M74 198 v5 M126 198 v5 M132 198 v6 M138 198 v5" stroke="#C9671A" stroke-width="2" stroke-linecap="round"/>
        </g>
        <!-- 머리 -->
        <g id="head">
          <g fill="#E8892B" id="mane"></g>
          <circle cx="100" cy="82" r="58" fill="#D9771F"/>
          <circle cx="58" cy="40" r="15" fill="#F7C46C"/><circle cx="58" cy="40" r="7.5" fill="#F2A35E"/>
          <circle cx="142" cy="40" r="15" fill="#F7C46C"/><circle cx="142" cy="40" r="7.5" fill="#F2A35E"/>
          <circle cx="100" cy="86" r="46" fill="#F7C46C"/>
          <ellipse cx="100" cy="106" rx="22" ry="16" fill="#FFF1D6"/>
          <g class="eye"><ellipse cx="81" cy="80" rx="6" ry="7.5" fill="#4A2E14"/><circle cx="83" cy="77.5" r="2.3" fill="#fff"/></g>
          <g class="eye"><ellipse cx="119" cy="80" rx="6" ry="7.5" fill="#4A2E14"/><circle cx="121" cy="77.5" r="2.3" fill="#fff"/></g>
          <ellipse cx="68" cy="96" rx="8" ry="5" fill="#F29C8B" opacity=".7"/>
          <ellipse cx="132" cy="96" rx="8" ry="5" fill="#F29C8B" opacity=".7"/>
          <path d="M93 97 Q100 93 107 97 Q100 105 93 97Z" fill="#7A3E1A"/>
          <path id="smile" d="M100 103 V107 M100 107 Q94 113 88 110 M100 107 Q106 113 112 110" stroke="#7A3E1A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <path id="frown" d="M100 103 V108 M89 114 Q100 106 111 114" stroke="#7A3E1A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <g id="mouthOpen"><ellipse cx="100" cy="113" rx="10" ry="9" fill="#7A3E1A"/><ellipse cx="100" cy="117" rx="6" ry="4" fill="#F28C8C"/></g>
        </g>
      </svg>
    </div>
    <div class="ground"></div>
  </aside>

  <section class="chat">
    <div class="top"><b>상담 기록 찾기</b><span id="info"></span>
      <label>참고 문서
        <select id="k"><option>1</option><option>2</option><option selected>3</option><option>5</option><option>10</option></select>
      </label>
    </div>
    <main id="log"></main>
    <div class="chips" id="examples"></div>
    <form id="f" autocomplete="off">
      <input id="q" placeholder="어흥이에게 물어보세요 (예: 보이스피싱 피해 접수 기록 알려줘)">
      <button id="send" type="submit">어흥!</button>
    </form>
    <div class="note">API에는 가명처리된 텍스트만 보내고, 답변의 이름표(토큰)는 복원하지 않아요.</div>
  </section>
</div>

<script>
// 갈기 (원 12개)
document.getElementById("mane").innerHTML = Array.from({length:12}, (_, i) => {
  const a = i * Math.PI / 6;
  return `<circle cx="${(100 + 56 * Math.cos(a)).toFixed(1)}" cy="${(84 + 56 * Math.sin(a)).toFixed(1)}" r="24"/>`;
}).join("");

const EXAMPLES = ["연락처가 010-0791-2924인 건 찾아줘", "보이스피싱 피해 접수 기록 알려줘", "윤 선영 고객 대출 상담 내역 알려줘"];
const WAIT = ["킁킁… 서류 더미를 뒤지는 중이에요", "이름표를 하나씩 맞춰보는 중이에요", "잠깐만요, 발로 서랍을 여는 중이에요"];
const FOUND = ["어흥! 찾았어요!", "킁킁, 냄새를 따라가 봤어요!", "어흥~ 서류 더미에서 찾아왔어요!"];

const stage = document.getElementById("stage"), speech = document.getElementById("speech");
const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chips = s => esc(s).replace(/&lt;([A-Z_]+_[0-9a-f]{8})&gt;/g, '<span class="tok">$1</span>');
const br = s => s.replace(/\n/g, "<br>");
const pick = a => a[Math.floor(Math.random() * a.length)];

// 어흥이 말하기: 한 글자씩 타이핑하며 입을 움직임 (이름표는 한 번에)
let talkId = 0;
function say(text, mood = "", speed = 38){
  const id = ++talkId;
  stage.className = "stage talking " + mood;
  const parts = text.split(/(<[A-Z_]+_[0-9a-f]{8}>)/);
  let html = "", pi = 0, ci = 0;
  return new Promise(done => {
    (function step(){
      if (id !== talkId) return done();
      if (pi >= parts.length){
        speech.innerHTML = html;
        stage.className = "stage " + mood;
        return done();
      }
      const p = parts[pi];
      if (/^<[A-Z_]+_[0-9a-f]{8}>$/.test(p)){ html += chips(p); pi++; }
      else if (ci < p.length){ html += esc(p[ci++]).replace("\n", "<br>"); }
      else { pi++; ci = 0; }
      speech.innerHTML = html + '<span class="caret"></span>';
      setTimeout(step, speed);
    })();
  });
}
function think(text){ talkId++; stage.className = "stage thinking"; speech.innerHTML = esc(text); }

function row(who, html){
  const r = document.createElement("div");
  r.className = "row " + who;
  r.innerHTML = `<div class="bubble">${html}</div>`;
  log.appendChild(r); log.scrollTop = log.scrollHeight;
  return r;
}

// 오른쪽 채팅에 넣을 답변 (LLM 답변은 그대로 표시)
function answerHtml(res){
  const docs = res.docs || [], qt = new Set(res.query_tokens || []);
  const list = docs.map((d, i) => {
    const hit = (d.tokens || []).some(t => qt.has(t));
    return `<div class="doc"><b>${i + 1}. ${esc(d.doc_id)}</b> · 점수 ${Number(d.score).toFixed(3)} ${hit ? '<span class="key">🔑 이름표 일치</span>' : ""}<pre>${chips(d.masked_text)}</pre></div>`;
  }).join("");
  const tokens = [...qt].map(chips).join(" ") || "없음 (의미 검색만 했어요)";
  const body = res.answer ? br(chips(res.answer.trim()).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")) : "LLM 키가 없어서 답변 대신 찾은 자료만 보여드려요.";
  return `<span class="who">🦁 어흥이</span>${body}
    <span class="tail">💡 주황색 이름표는 개인정보를 숨긴 표시예요.</span>
    <details><summary>어흥이가 찾은 자료 보기 (${docs.length}건)</summary>
      <div class="meta">가명처리된 질문: ${chips(res.masked_query)}</div>
      <div class="meta">질문 속 이름표: ${tokens}</div>${list}</details>`;
}

// 왼쪽 말풍선용 한두 문장
function shortLine(res){
  const a = (res.answer || "").replace(/\*\*/g, "").trim();
  if (/답할 수 없|찾을 수 없|확인되지 않|없습니다/.test(a.slice(0, 80)) && !(res.docs || []).length) return null;
  const first = a.split(/(?<=[.!?。])\s+|\n/).find(s => s.trim()) || "";
  return first.length > 70 ? first.slice(0, 68) + "…" : first;
}

async function ask(text){
  text = text.trim(); if (!text) return;
  row("me", esc(text)); q.value = ""; send.disabled = true;
  think(pick(WAIT));
  try {
    const r = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({query:text, k:Number(document.getElementById("k").value)})});
    const res = await r.json();
    if (res.error){ await say("어흥? " + res.error, "sad"); return; }
    row("bot", answerHtml(res));
    const cantAnswer = /답할 수 없|답변드리기 어렵|찾을 수 없/.test(res.answer || "");
    if (!(res.docs || []).length || cantAnswer){
      await say("어흥… 관련 기록을 잘 못 찾았어요. 다르게 물어봐 줄래요?", "sad");
    } else {
      const line = shortLine(res);
      await say(`${pick(FOUND)}\n${line || "오른쪽에 정리해 뒀어요!"}`, "happy");
    }
  } catch (e) {
    await say("어흥… 서버에 연결하지 못했어요. 터미널에서 uvicorn이 켜져 있는지 봐 주세요!", "sad");
  } finally { send.disabled = false; q.focus(); }
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); ask(q.value); });
const ex = document.getElementById("examples");
EXAMPLES.forEach(s => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => ask(s); ex.appendChild(b); });

row("bot", `<span class="who">🦁 어흥이</span>궁금한 상담 기록을 물어보면 찾아드릴게요.<br>이름이나 전화번호 같은 개인정보는 이름표로 바꿔서 숨긴 다음에 찾아요!`);
say("어흥! 안녕하세요,\n저는 아기 사자 어흥이예요.\n궁금한 기록을 물어봐 주세요!");

fetch("/api/info").then(r => r.json()).then(i => {
  document.getElementById("info").textContent = `검색 ${i.search_mode} · 임베딩 ${i.embed_model} · LLM ${i.llm_model}`;
}).catch(() => {});
</script>
</body>
</html>
